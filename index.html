<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TimeTable Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>*{box-sizing:border-box;}body{margin:0;font-family:system-ui,sans-serif;background:#f8fafc;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

function App() {
  const [page, setPage] = useState("login");
  const [email, setEmail] = useState("");

  if(page === "login") {
    return (
      <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#4f46e5,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div style={{background:"white",borderRadius:24,padding:32,width:"100%",maxWidth:380,boxShadow:"0 24px 64px rgba(0,0,0,0.3)"}}>
          <div style={{textAlign:"center",marginBottom:24}}>
            <div style={{width:64,height:64,background:"#4f46e5",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,margin:"0 auto 12px"}}>📅</div>
            <div style={{fontWeight:800,fontSize:22,color:"#1e293b"}}>TimeTable Pro</div>
            <div style={{fontSize:13,color:"#94a3b8",marginTop:4}}>School Timetable Management</div>
          </div>
          <button
            onClick={() => setPage("demo")}
            style={{width:"100%",background:"#4f46e5",color:"white",border:"none",borderRadius:12,padding:13,fontWeight:700,fontSize:14,cursor:"pointer",marginBottom:12}}>
            🎓 Try Demo Account
          </button>
          <div style={{marginBottom:12}}>
            <input
              value={email}
              onChange={e => setEmail(e.target.value)}
              placeholder="Or enter your email"
              style={{width:"100%",border:"2px solid #e2e8f0",borderRadius:12,padding:"11px 14px",fontSize:14,outline:"none",boxSizing:"border-box"}}/>
          </div>
          <button
            onClick={() => alert("Please contact admin@felevare.com for access")}
            style={{width:"100%",background:"white",color:"#4f46e5",border:"2px solid #4f46e5",borderRadius:12,padding:12,fontWeight:700,fontSize:14,cursor:"pointer"}}>
            Sign In with Email
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",background:"#f8fafc",fontFamily:"system-ui,sans-serif"}}>
      <div style={{background:"#4f46e5",color:"white",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,background:"rgba(255,255,255,0.2)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>📅</div>
          <div>
            <div style={{fontWeight:700,fontSize:15}}>TimeTable Pro</div>
            <div style={{fontSize:11,opacity:0.7}}>St. Mary's High School (Demo)</div>
          </div>
        </div>
        <button onClick={() => setPage("login")} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"white",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>
          Exit Demo
        </button>
      </div>
      <div style={{maxWidth:800,margin:"0 auto",padding:20}}>
        <div style={{background:"#fef3c7",border:"1px solid #fde68a",borderRadius:12,padding:"10px 16px",marginBottom:20,fontSize:13,color:"#92400e",fontWeight:600}}>
          🎓 Demo Mode — Sample school data loaded. Sign up to save your own data.
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
          {[
            {icon:"🎓",label:"Standards",value:"3",color:"#eef2ff",border:"#c7d2fe",text:"#4338ca"},
            {icon:"👨‍🏫",label:"Teachers",value:"3",color:"#f0fdf4",border:"#bbf7d0",text:"#166534"},
            {icon:"📚",label:"Subjects",value:"7",color:"#fef9c3",border:"#fde047",text:"#854d0e"},
            {icon:"📅",label:"Periods/Week",value:"45",color:"#fce7f3",border:"#f9a8d4",text:"#9d174d"},
          ].map(s => (
            <div key={s.label} style={{background:s.color,border:`1px solid ${s.border}`,borderRadius:14,padding:16,textAlign:"center"}}>
              <div style={{fontSize:28}}>{s.icon}</div>
              <div style={{fontSize:24,fontWeight:800,color:s.text,marginTop:4}}>{s.value}</div>
              <div style={{fontSize:12,color:s.text,opacity:0.7}}>{s.label}</div>
            </div>
          ))}
        </div>
        <div style={{background:"white",borderRadius:14,border:"1px solid #e2e8f0",padding:20,textAlign:"center"}}>
          <div style={{fontSize:18,fontWeight:700,color:"#1e293b",marginBottom:8}}>Ready to get started?</div>
          <div style={{fontSize:13,color:"#64748b",marginBottom:16}}>Sign up to create your school's timetable and save all data permanently.</div>
          <button onClick={() => setPage("login")}
            style={{background:"#4f46e5",color:"white",border:"none",borderRadius:12,padding:"12px 32px",fontWeight:700,fontSize:14,cursor:"pointer"}}>
            Get Started →
          </button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App, null));
</script>
</body>
</html>
