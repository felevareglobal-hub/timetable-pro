          {/* Mode toggle */}
          <div style={{display:"flex",gap:4,background:"#f1f5f9",borderRadius:10,padding:4,width:"fit-content"}}>
            {[{id:"class",label:"📋 By Class"},{id:"teacher",label:"👨‍🏫 By Teacher"}].map(m=>(
              <button key={m.id} onClick={()=>setViewMode(m.id)}
                style={{padding:"7px 16px",borderRadius:7,border:"none",cursor:"pointer",fontSize:12,fontWeight:700,
                  background:viewMode===m.id?"#4f46e5":"transparent",
                  color:viewMode===m.id?"white":"#64748b"}}>
                {m.label}
              </button>
            ))}
          </div>

          {/* ── BY CLASS ── */}
          {viewMode==="class"&&(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {allKeys.map(k=>(
                  <button key={k.key} onClick={()=>setActiveKey(k.key)}
                    style={{padding:"6px 14px",borderRadius:20,cursor:"pointer",fontSize:11,fontWeight:700,
                      border:`2px solid ${activeKey===k.key?"#4f46e5":"#e2e8f0"}`,
                      background:activeKey===k.key?"#4f46e5":"white",
                      color:activeKey===k.key?"white":"#475569"}}>
                    {k.label}
                  </button>
                ))}
              </div>

              {/* Class Teacher Assign */}
              {activeKey&&(
                <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                  <span style={{fontSize:12,fontWeight:700,color:"#475569"}}>👩‍🏫 Class Teacher:</span>
                  <select value={classTeachers[activeKey]||""} onChange={e=>setClassTeachers(p=>({...p,[activeKey]:e.target.value}))}
                    style={{border:"1px solid #e2e8f0",borderRadius:8,padding:"5px 10px",fontSize:12,background:"white",flex:1,minWidth:150}}>
                    <option value="">-- Assign Class Teacher --</option>
                    {teachers.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                  </select>
                </div>
              )}

              {activeKey&&timetable[activeKey]&&(()=>{
                const info=allKeys.find(k=>k.key===activeKey);
                const ctId=classTeachers[activeKey];
                const ct=teachers.find(t=>t.id===ctId);
                const filled=workingDays.reduce((a,d)=>a+(timetable[activeKey][d]||[]).filter(c=>c&&!c.fixed&&c.subject&&c.subject!=="No assignment"&&c.subject!=="Conflict").length,0);
                const total=workingDays.reduce((a,d)=>a+(timetable[activeKey][d]||[]).filter(c=>c===null||(c&&!c.fixed)).length,0);
                return(
                  <TTable
                    headerBg="#4f46e5"
                    classKey={activeKey}
                    editable={true}
                    headerContent={
                      <div>
                        <div style={{fontWeight:700,fontSize:14}}>{info?.label}</div>
                        <div style={{fontSize:11,opacity:0.75,marginTop:2}}>
                          Class Teacher: {ct?.name||"Not assigned"} · {filled}/{total} periods filled
                        </div>
                      </div>
                    }
                    getCellForDay={(day,si)=>{
                      const cell=(timetable[activeKey][day]||[])[si];
                      if(cell&&!cell.fixed&&!cell.std){
                        const info=allKeys.find(k=>k.key===activeKey);
                        return {...cell, std:info?.stdName||""};
                      }
                      return cell;
                    }}
                  />
                );
              })()}

              {activeKey&&!timetable[activeKey]&&(
                <div style={{background:"#fef3c7",border:"1px solid #fde68a",borderRadius:10,padding:14,fontSize:13,color:"#92400e"}}>
                  ⚠️ No data for this class. Add teacher assignments and regenerate.
                </div>
              )}
            </div>
          )}

          {/* ── BY TEACHER ── */}
          {viewMode==="teacher"&&(
            <div style={{display:"flex",flexDirection:"column",gap:12}}>

              {/* Teacher selector pills */}
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {teachers.map(t=>{
                  const isActive = viewTeacher===t.id;
                  const totalPeriods = allKeys.reduce((a,k)=>{
                    return a + workingDays.reduce((b,day)=>{
                      return b + ((timetable[k.key]?.[day]||[]).filter(c=>c&&!c.fixed&&c.teacherId===t.id).length);
                    },0);
                  },0);
                  return(
                    <button key={t.id} onClick={()=>setViewTeacher(t.id)}
                      style={{display:"flex",alignItems:"center",gap:8,padding:"6px 14px",borderRadius:20,cursor:"pointer",
                        border:`2px solid ${isActive?"#7c3aed":"#e2e8f0"}`,
                        background:isActive?"#7c3aed":"white",
                        color:isActive?"white":"#475569"}}>
                      {t.photo&&<img src={t.photo} style={{width:22,height:22,borderRadius:"50%",objectFit:"cover",border:"2px solid rgba(255,255,255,0.5)"}}/>}
                      {!t.photo&&<div style={{width:22,height:22,borderRadius:"50%",background:isActive?"rgba(255,255,255,0.3)":"#eef2ff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>👤</div>}
                      <span style={{fontSize:11,fontWeight:700}}>{t.name}</span>
                      <span style={{fontSize:10,opacity:0.75,background:isActive?"rgba(255,255,255,0.2)":"#f1f5f9",padding:"1px 6px",borderRadius:10}}>{totalPeriods}p</span>
                    </button>
                  );
                })}
              </div>

              {viewTeacher&&(()=>{
                const t = teachers.find(x=>x.id===viewTeacher);
                if(!t) return null;

                // Build teacher's full weekly schedule
                // For each day+slot, find which class they are in
                const schedule = {}; // {day: [{si, subject, classLabel, slotTime, periodNum}]}
                workingDays.forEach(day=>{
                  schedule[day] = [];
                  let pNum = 0;
                  refSlots.forEach((slot,si)=>{
                    if(!isBreak(slot.type)&&slot.type!=="assembly") pNum++;
                    let found = null;
                    allKeys.forEach(k=>{
                      const cell=(timetable[k.key]?.[day]||[])[si];
                      if(cell&&!cell.fixed&&cell.teacherId===viewTeacher){
                        found = {si, subject:cell.subject, classLabel:k.label, slotTime:minsToTime(refTimes[si]?.start||startMins), periodNum:pNum, type:"lecture"};
                      }
                    });
                    if(!found&&(slot.type==="assembly"||isBreak(slot.type))){
                      found = {si, subject:slot.label||slot.type, classLabel:"", slotTime:minsToTime(refTimes[si]?.start||startMins), periodNum:null, type:slot.type};
                    }
                    schedule[day].push(found);
                  });
                });

                // Count stats
                const totalAssigned = workingDays.reduce((a,day)=>a+schedule[day].filter(s=>s&&s.type==="lecture").length,0);
                const classesHandled = [...new Set(allKeys.filter(k=>
                  workingDays.some(day=>(timetable[k.key]?.[day]||[]).some(c=>c&&!c.fixed&&c.teacherId===viewTeacher))
                ).map(k=>k.label))];

                return(
                  <div style={{display:"flex",flexDirection:"column",gap:12}}>

                    {/* Teacher profile card */}
                    <div style={{background:"white",borderRadius:16,border:"1px solid #e2e8f0",padding:16,display:"flex",alignItems:"center",gap:14,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
                      <div style={{width:64,height:64,borderRadius:14,overflow:"hidden",background:"#eef2ff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0,border:"3px solid #e0e7ff"}}>
                        {t.photo?<img src={t.photo} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"👤"}
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:800,fontSize:16,color:"#1e293b"}}>{t.name}</div>
                        <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>
                          {[t.bloodGroup&&`🩸 ${t.bloodGroup}`,t.whatsapp&&`📱 ${t.whatsapp}`,t.emergency&&`🆘 ${t.emergency}`].filter(Boolean).join("  ·  ")}
                        </div>
                        <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:6}}>
                          {(t.subjects||[]).map(s=>(
                            <span key={s} style={{background:"#eef2ff",color:"#4338ca",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20}}>{s}</span>
                          ))}
                        </div>
                      </div>
                      {/* Quick stats */}
                      <div style={{display:"flex",flexDirection:"column",gap:6,flexShrink:0,textAlign:"center"}}>
                        <div style={{background:"#7c3aed",color:"white",borderRadius:10,padding:"8px 14px"}}>
                          <div style={{fontSize:20,fontWeight:800}}>{totalAssigned}</div>
                          <div style={{fontSize:9,opacity:0.8,marginTop:1}}>Periods/Week</div>
                        </div>
                        <div style={{background:"#f0fdf4",color:"#166534",border:"1px solid #bbf7d0",borderRadius:10,padding:"6px 14px"}}>
                          <div style={{fontSize:16,fontWeight:800}}>{classesHandled.length}</div>
                          <div style={{fontSize:9,marginTop:1}}>Classes</div>
                        </div>
                      </div>
                    </div>

                    {/* Classes handled summary */}
                    {classesHandled.length>0&&(
                      <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:12,padding:"10px 14px"}}>
                        <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:6}}>CLASSES HANDLED</div>
                        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                          {classesHandled.map(cl=>(
                            <span key={cl} style={{background:"#eef2ff",color:"#4338ca",fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:8,border:"1px solid #c7d2fe"}}>{cl}</span>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Weekly timetable grid */}
                    <div style={{background:"white",borderRadius:16,border:"1px solid #e2e8f0",overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
                      <div style={{background:"#7c3aed",color:"white",padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <div>
                          <div style={{fontWeight:700,fontSize:14}}>Weekly Schedule — {t.name}</div>
                          <div style={{fontSize:11,opacity:0.75,marginTop:2}}>{totalAssigned} periods across {classesHandled.length} class{classesHandled.length!==1?"es":""}</div>
                        </div>
                        <div style={{display:"flex",gap:5}}>
                          {t?.whatsapp&&(
                            <button onClick={()=>shareTeacherWhatsApp(t.id)}
                              style={{background:"#25D366",color:"white",border:"none",borderRadius:8,padding:"5px 10px",fontSize:10,fontWeight:700,cursor:"pointer"}}>
                              💬 WhatsApp
                            </button>
                          )}
                          <button onClick={()=>exportTeacherPDF(t.id)}
                            style={{background:"#dc2626",color:"white",border:"none",borderRadius:8,padding:"5px 10px",fontSize:10,fontWeight:700,cursor:"pointer"}}>
                            📄 PDF
                          </button>
                        </div>
                      </div>
                      <div style={{overflowX:"auto"}}>
                        <table style={{borderCollapse:"collapse",width:"100%",minWidth:500}}>
                          <thead>
                            <tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
                              <th style={{padding:"8px 10px",textAlign:"left",fontSize:9,color:"#94a3b8",fontWeight:700,width:65,whiteSpace:"nowrap"}}>TIME</th>
                              <th style={{padding:"8px 6px",textAlign:"center",fontSize:9,color:"#94a3b8",fontWeight:700,width:30}}>PD</th>
                              {workingDays.map(d=>(
                                <th key={d} style={{padding:"8px 6px",textAlign:"center",fontSize:10,color:"#374151",fontWeight:700,minWidth:100}}>
                                  {d.slice(0,3).toUpperCase()}
                                </th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {refSlots.map((slot,si)=>{
                              const slotTime = minsToTime(refTimes[si]?.start||startMins);
                              const isFixedSlot = isBreak(slot.type)||slot.type==="assembly";
                              let pNum = 0;
                              for(let i=0;i<=si;i++){
                                if(!isBreak(refSlots[i].type)&&refSlots[i].type!=="assembly") pNum++;
                              }
                              return(
                                <tr key={si} style={{borderBottom:"1px solid #f8fafc",background:isFixedSlot?"#fffbeb":"white"}}>
                                  <td style={{padding:"4px 10px",fontSize:9,color:"#94a3b8",fontFamily:"monospace",whiteSpace:"nowrap",verticalAlign:"middle"}}>{slotTime}</td>
                                  <td style={{padding:"4px 6px",textAlign:"center",fontSize:9,color:"#cbd5e1",fontWeight:700,verticalAlign:"middle"}}>
                                    {isFixedSlot?"":pNum}
                                  </td>
                                  {workingDays.map(day=>{
                                    const entry = schedule[day]?.[si];
                                    if(!entry){
                                      return <td key={day} style={{padding:3}}>
                                        <div style={{minHeight:42,background:"#f8fafc",borderRadius:8,border:"1px solid #f1f5f9"}}/>
                                      </td>;
                                    }
                                    if(entry.type==="assembly"){
                                      return <td key={day} style={{padding:3}}>
                                        <div style={{background:"#fef9c3",border:"1px solid #fde047",borderRadius:8,padding:"5px 8px",minHeight:42,display:"flex",alignItems:"center",justifyContent:"center"}}>
                                          <span style={{fontSize:10,fontWeight:600,color:"#854d0e"}}>🏫 Assembly</span>
                                        </div>
                                      </td>;
                                    }
                                    if(isBreak(entry.type)){
                                      const bg=entry.type==="lunch"?"#ffedd5":"#dcfce7";
                                      const bdr=entry.type==="lunch"?"#fdba74":"#86efac";
                                      const txt=entry.type==="lunch"?"#9a3412":"#166534";
                                      const icon=entry.type==="lunch"?"🍱":"☕";
                                      return <td key={day} style={{padding:3}}>
                                        <div style={{background:bg,border:`1px solid ${bdr}`,borderRadius:8,padding:"5px 8px",minHeight:42,display:"flex",alignItems:"center",justifyContent:"center"}}>
                                          <span style={{fontSize:10,fontWeight:600,color:txt}}>{icon} {entry.subject}</span>
                                        </div>
                                      </td>;
                                    }
                                    if(entry.type==="lecture"&&entry.classLabel){
                                      const c=sColor[entry.subject]||{bg:"#f1f5f9",bdr:"#e2e8f0",txt:"#374151"};
                                      return <td key={day} style={{padding:3,verticalAlign:"top"}}>
                                        <div style={{background:c.bg,border:`1px solid ${c.bdr}`,borderRadius:8,padding:"5px 8px",minHeight:42}}>
                                          <div style={{fontSize:11,fontWeight:700,color:c.txt,lineHeight:1.3}}>{entry.subject}</div>
                                          <div style={{fontSize:10,fontWeight:600,color:c.txt,opacity:0.8,marginTop:2,background:"rgba(255,255,255,0.6)",borderRadius:4,padding:"1px 5px",display:"inline-block"}}>{entry.classLabel}</div>
                                        </div>
                                      </td>;
                                    }
                                    // Free period
                                    return <td key={day} style={{padding:3}}>
                                      <div style={{minHeight:42,background:"#f8fafc",borderRadius:8,border:"1px dashed #e2e8f0",display:"flex",alignItems:"center",justifyContent:"center"}}>
                                        <span style={{fontSize:9,color:"#cbd5e1"}}>free</span>
                                      </div>
                                    </td>;
                                  })}
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* Day-wise summary with Drag & Drop */}
                    <div style={{background:"white",border:"1px solid #e2e8f0",borderRadius:12,padding:14}}>
                      <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.05em"}}>Day-wise Summary</div>
                      <div style={{fontSize:10,color:"#94a3b8",marginBottom:10}}>Drag any period pill to a different day to move it</div>
                      <div style={{display:"flex",flexDirection:"column",gap:8}}>
                        {workingDays.map(day=>{
                          const daySlots = schedule[day]?.filter(s=>s&&s.type==="lecture")||[];
                          return(
                            <div key={day}
                              style={{display:"flex",alignItems:"flex-start",gap:10,padding:"6px 8px",borderRadius:8,
                                border:"2px dashed #e2e8f0",minHeight:42,transition:"background 0.15s"}}
                              onDragOver={e=>{e.preventDefault();e.currentTarget.style.background="#eef2ff";e.currentTarget.style.borderColor="#6366f1";}}
                              onDragLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.borderColor="#e2e8f0";}}
                              onDrop={e=>{
                                e.preventDefault();
                                e.currentTarget.style.background="transparent";
                                e.currentTarget.style.borderColor="#e2e8f0";
                                try {
                                  const data = JSON.parse(e.dataTransfer.getData("text/plain"));
                                  const {fromDay, fromSi, classKey} = data;
                                  if(fromDay===day) return;
                                  // Find first empty lecture slot in target day
                                  const targetSlots = (timetable[classKey]?.[day]||[]);
                                  let targetSi = -1;
                                  for(let i=0;i<targetSlots.length;i++){
                                    if(targetSlots[i]===null) { targetSi=i; break; }
                                  }
                                  if(targetSi===-1) { alert("No empty slot available on "+day); return; }
                                  // Move cell
                                  setTimetable(prev=>{
                                    const updated = JSON.parse(JSON.stringify(prev));
                                    const cell = updated[classKey][fromDay][fromSi];
                                    updated[classKey][day][targetSi] = cell;
                                    updated[classKey][fromDay][fromSi] = null;
                                    return updated;
                                  });
                                } catch(err){ console.error(err); }
                              }}>
                              <div style={{width:36,fontSize:11,fontWeight:700,color:"#475569",flexShrink:0,paddingTop:4}}>{day.slice(0,3)}</div>
                              <div style={{flex:1,display:"flex",flexWrap:"wrap",gap:4}}>
                                {daySlots.length===0
                                  ? <span style={{fontSize:11,color:"#cbd5e1",paddingTop:4}}>Drop here to add</span>
                                  : daySlots.map((s,i)=>{
                                      const c=sColor[s.subject]||{bg:"#f1f5f9",bdr:"#e2e8f0",txt:"#374151"};
                                      return(
                                        <span key={i}
                                          draggable={true}
                                          onDragStart={e=>{
                                            e.dataTransfer.setData("text/plain", JSON.stringify({
                                              fromDay:day, fromSi:s.si, classKey:activeKey
                                            }));
                                            e.currentTarget.style.opacity="0.5";
                                          }}
                                          onDragEnd={e=>{e.currentTarget.style.opacity="1";}}
                                          style={{background:c.bg,border:`1px solid ${c.bdr}`,color:c.txt,
                                            fontSize:10,fontWeight:600,padding:"3px 8px",borderRadius:6,
                                            cursor:"grab",userSelect:"none",display:"flex",alignItems:"center",gap:4}}>
                                          <span style={{opacity:0.5}}>⠿</span>
                                          P{s.periodNum} · {s.subject}
                                          {s.classLabel&&<span style={{opacity:0.6}}>· {s.classLabel}</span>}
                                        </span>
                                      );
                                    })
                                }
                              </div>
                              <div style={{fontSize:11,fontWeight:700,color:"#7c3aed",flexShrink:0,paddingTop:4}}>{daySlots.length}p</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                  </div>
                );
              })()}
            </div>
          )}
          {/* Subject legend */}
          {allSubjects.length>0&&(
            <div style={{background:"white",border:"1px solid #e2e8f0",borderRadius:12,padding:12}}>
              <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}}>Subject Legend</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {allSubjects.map(s=>{const c=sColor[s]||{bg:"#f1f5f9",bdr:"#e2e8f0",txt:"#374151"};return(
                  <div key={s} style={{background:c.bg,border:`1px solid ${c.bdr}`,borderRadius:6,padding:"3px 10px",fontSize:10,fontWeight:600,color:c.txt}}>{s}</div>
                );})}
              </div>
            </div>
          )}

          {/* Debug log */}
          {debugLog.length>0&&(
            <details style={{background:"#0f172a",borderRadius:10,padding:12}}>
              <summary style={{color:"#94a3b8",fontSize:11,fontWeight:700,cursor:"pointer",userSelect:"none"}}>🔍 Debug Log ({debugLog.length} lines)</summary>
              <div style={{marginTop:8}}>
                {debugLog.map((line,i)=>(
                  <div key={i} style={{color:"#4ade80",fontSize:10,fontFamily:"monospace",lineHeight:1.6}}>{line}</div>
                ))}
              </div>
            </details>
          )}
        </>
      )}
    </div>
  );
}

            {id:"da3",standardId:"demo-std2",division:"A",subject:"Science",periodsPerWeek:4},
          ]},
        {id:"demo-t2",name:"Mr. Rahul Patel",whatsapp:"+91 98765 43211",bloodGroup:"O+",photo:"",subjects:["English","Hindi"],
          assignments:[
            {id:"da4",standardId:"demo-std1",division:"A",subject:"English",periodsPerWeek:4},
            {id:"da5",standardId:"demo-std1",division:"B",subject:"Hindi",periodsPerWeek:3},
            {id:"da6",standardId:"demo-std2",division:"A",subject:"English",periodsPerWeek:4},
          ]},
        {id:"demo-t3",name:"Mrs. Sunita Joshi",whatsapp:"+91 98765 43212",bloodGroup:"A+",photo:"",subjects:["Social Studies","Computer Science"],
          assignments:[
            {id:"da7",standardId:"demo-std1",division:"A",subject:"Social Studies",periodsPerWeek:3},
            {id:"da8",standardId:"demo-std2",division:"A",subject:"Computer Science",periodsPerWeek:3},
          ]},
      ]);
    }
  },[currentSchool]);

  // ── Supabase auto-save ──
  const [saving,setSaving]   = useState(false);
  const [savedMsg,setSavedMsg] = useState("");
  const [dataLoaded,setDataLoaded] = useState(false);
  const schoolId = currentSchool?.id;
  const isDemo   = currentSchool?.is_demo;

  function showSaved(msg){ setSavedMsg(msg||"Saved ✓"); setTimeout(()=>setSavedMsg(""),2500); }

  // Load all data from Supabase on mount
  useEffect(()=>{
    if(!schoolId||isDemo){ setDataLoaded(true); return; }
    async function loadAll(){
      setSaving(true);
      try {
        const [sc,stds,subs,dsch,tchs,asgs,tt] = await Promise.all([
          db.getSchool(schoolId),
          db.getStandards(schoolId),
          db.getSubjects(schoolId),
          db.getDaySchedules(schoolId),
          db.getTeachers(schoolId),
          db.getAssignments(schoolId),
          db.getTimetable(schoolId),
        ]);
        if(sc) setSchool(s=>({...s,...sc}));
        if(stds?.length) setStandards(stds.map(s=>({...s,numDivisions:s.divisions?.length||1})));
        if(subs?.length) setSubjects(subs.map(s=>s.name));
        if(dsch?.length){
          const ds={};
          dsch.forEach(d=>{ ds[d.day_name]={slots:d.slots||[]}; });
          setDaySchedules(prev=>({...prev,...ds}));
        }
        if(tchs?.length){
          // Merge assignments into teachers
          const tWithAssign = tchs.map(t=>({
            ...t,
            subjects: t.subjects||[],
            assignments: (asgs||[]).filter(a=>a.teacher_id===t.id).map(a=>({
              id:a.id, standardId:a.standard_id, division:a.division,
              subject:a.subject, periodsPerWeek:a.periods_per_week
            }))
          }));
          setTeachers(tWithAssign);
        }
        if(tt?.data) {
          setTimetable(tt.data);
          if(tt.class_teachers) setClassTeachers(tt.class_teachers);
        }
      } catch(e){ console.error("Load error:",e); }
      setSaving(false);
      setDataLoaded(true);
    }
    loadAll();
  },[schoolId]);

  // Auto-save school profile
  async function saveSchoolProfile(updated){
    if(!schoolId||isDemo) return;
    setSaving(true);
    await db.saveSchool({...updated,id:schoolId});
    showSaved("School profile saved ✓");
    setSaving(false);
  }

  // Auto-save standards
  async function saveStandards(updated){
    if(!schoolId||isDemo) return;
    setSaving(true);
    await db.saveStandards(schoolId, updated);
    showSaved("Standards saved ✓");
    setSaving(false);
  }

  // Auto-save subjects
  async function saveSubjects(updated){
    if(!schoolId||isDemo) return;
    setSaving(true);
    await db.saveSubjects(schoolId, updated);
    showSaved("Subjects saved ✓");
    setSaving(false);
  }

  // Auto-save day schedule
  async function saveDaySchedule(day, slots){
    if(!schoolId||isDemo) return;
    await db.saveDaySchedule(schoolId, day, slots);
  }

  // Save teacher
  async function saveTeacherToDb(teacher){
    if(!schoolId||isDemo) return;
    setSaving(true);
    const { assignments, ...teacherData } = teacher;
    const saved = await db.saveTeacher({...teacherData, school_id:schoolId});
    const tid = saved?.[0]?.id || teacher.id;
    await db.saveAssignments(schoolId, tid, assignments||[]);
    showSaved("Teacher saved ✓");
    setSaving(false);
    return tid;
  }

  // Save timetable
  async function saveTimetableToDb(tt, ct){
    if(!schoolId||isDemo) return;
    await db.saveTimetable(schoolId, tt, ct||{});
    showSaved("Timetable saved ✓");
  }

  // ── Razorpay Payment ──
  const RZP_KEY = "rzp_test_T92O7ZiZOBsoCw";

  async function initiatePayment(planName, amount, billingCycle){
    return new Promise((resolve,reject)=>{
      const options = {
        key: RZP_KEY,
        amount: amount * 100, // paise
        currency: "INR",
        name: "TimeTable Pro",
        description: planName+" Plan - "+billingCycle,
        image: "https://felevareglobal-hub.github.io/timetable-pro/",
        handler: async function(response){
          // Save subscription to Supabase
          await supa("POST","tt_subscriptions",{
            school_id: schoolId,
            plan_name: planName,
            status: "active",
            billing_cycle: billingCycle,
            amount_paid: amount,
            razorpay_payment_id: response.razorpay_payment_id,
            current_period_start: new Date().toISOString(),
            current_period_end: new Date(Date.now()+(billingCycle==="yearly"?365:30)*24*60*60*1000).toISOString(),
          });
          await supa("POST","tt_payments",{
            school_id: schoolId,
            razorpay_payment_id: response.razorpay_payment_id,
            amount: amount,
            currency: "INR",
            status: "paid",
            plan_name: planName,
            billing_cycle: billingCycle,
          });
          showSaved("Payment successful! Plan activated ✓");
          resolve(response);
        },
        prefill: {
          name: currentUser?.name||"",
          email: currentUser?.email||"",
        },
        theme: { color: "#4f46e5" },
        modal: { ondismiss: ()=>reject("Payment cancelled") }
      };
      const rzp = new window.Razorpay(options);
      rzp.open();
    });
  }

  const screenProps={
    school,setSchool,standards,setStandards,subjects,setSubjects,
    teachers,setTeachers,daySchedules,setDaySchedules,timetable,setTimetable,
    saveSchoolProfile,saveStandards,saveSubjects,saveDaySchedule,

      {/* ── Header ── */}

        <div style={{width:32,height:32,background:"rgba(255,255,255,0.2)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>📅</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:14,lineHeight:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{school.name||"TimeTable Pro"}</div>
          <div style={{fontSize:11,opacity:0.7,marginTop:2,display:"flex",alignItems:"center",gap:6}}>
            <span>{currentNav?.icon} {currentNav?.label}</span>

function LoginScreen({onLogin}) {
  const [email,setEmail]     = useState("");
  const [loading,setLoading] = useState(false);
  const [googleLoading,setGoogleLoading] = useState(false);
  const [error,setError]     = useState("");
  const [debugInfo,setDebugInfo] = useState("");
  const [tab,setTab]         = useState("google"); // google | email

  // Handle Google OAuth redirect callback
  useEffect(()=>{
    const hash = window.location.hash;
    if(hash.includes("access_token")){
      handleGoogleCallback();
    }
  },[]);

  async function handleGoogleCallback(){
    setGoogleLoading(true);
    const debug = [];
    try {
      const hashStr = window.location.hash.replace("#","");
      debug.push("Hash length: "+hashStr.length);
      const params = new URLSearchParams(hashStr);
      const accessToken = params.get("access_token");
      const tokenType   = params.get("token_type");
      const expiresIn   = params.get("expires_in");
      const providerToken = params.get("provider_token");
      debug.push("access_token present: "+(!!accessToken));
      debug.push("token_type: "+tokenType);
      debug.push("provider_token present: "+(!!providerToken));

      if(!accessToken){
        setError("Google login failed — no token received.");
        setDebugInfo(debug.join(" | "));
        setGoogleLoading(false);
        return;
      }

      const res = await fetch(SUPA_URL+"/auth/v1/user", {
        headers: {
          "Authorization": "Bearer "+accessToken,
          "apikey": SUPA_KEY
        }
      });

      debug.push("Supabase /auth/v1/user status: "+res.status);
      const bodyText = await res.text();
      debug.push("Response body: "+bodyText.substring(0,300));

      if(!res.ok){
        setError("Could not verify Google session (status "+res.status+"). See debug info below.");
        setDebugInfo(debug.join(" || "));
        setGoogleLoading(false);
        return;
      }

      let supaUser;
      try { supaUser = JSON.parse(bodyText); } catch(parseErr){
        setError("Could not parse Supabase response.");
        setDebugInfo(debug.join(" || "));
        setGoogleLoading(false);
        return;
      }

      const email = (supaUser.email || supaUser.user_metadata?.email || supaUser.user_metadata?.user_name || "").toLowerCase();
      debug.push("Extracted email: "+(email||"NONE"));

      if(!email){
        setError("Could not get email from Google account.");
        setDebugInfo(debug.join(" || "));
        setGoogleLoading(false);
        return;
      }

      window.history.replaceState(null,"",window.location.pathname);

      const user = await db.getUserByEmail(email);
      if(!user){
        setError("No account found for "+email+". Contact your administrator to get access.");
        setGoogleLoading(false);
        return;
      }
      let school = null;
      if(user.role!=="super_admin"&&user.school_id) school = await db.getSchool(user.school_id);
      onLogin(user,school);
    } catch(e){
      setError("Google login error: "+e.message);
      setDebugInfo("Exception: "+e.message+" || "+debug.join(" || "));
      console.error("Google callback error:", e);
    }
    setGoogleLoading(false);
  }

  async function handleGoogleLogin(){
    setGoogleLoading(true); setError("");
    try {
      // Use Supabase Google OAuth
      const redirectTo = window.location.origin + window.location.pathname;
      const url = SUPA_URL+"/auth/v1/authorize?provider=google&redirect_to="+encodeURIComponent(redirectTo);
      window.location.href = url;
    } catch(e){ setError("Could not initiate Google login."); setGoogleLoading(false); }
  }

  async function handleEmailLogin() {
    if(!email.trim()) return;
    setLoading(true); setError("");
    try {
      const user = await db.getUserByEmail(email.trim().toLowerCase());
      if(!user){ setError("No account found for this email. Contact your administrator."); setLoading(false); return; }
      let school = null;
      if(user.role!=="super_admin"&&user.school_id) school = await db.getSchool(user.school_id);
      onLogin(user,school);
    } catch(e){ setError("Login failed. Try again."); }
    setLoading(false);
  }

  function handleDemoLogin() {
    // Demo user — Principal role with pre-loaded sample school
    const demoUser = {
      id: "demo-user",
      email: "demo@timetablepro.in",
      name: "Demo Principal",
      role: "principal",
      school_id: "demo-school",
    };
    const demoSchool = {
      id: "demo-school",
      name: "St. Mary's High School (Demo)",
      address: "123 MG Road, Mumbai, Maharashtra 400001",
      board: "CBSE",
      principal_name: "Demo Principal",
      principal_address: "Mumbai",
      start_time: "10:00",
      operation_days: "5",
      saturday_working: true,
      weekly_holidays: ["Sunday"],
      is_demo: true,
    };
    onLogin(demoUser, demoSchool);
  }

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:16,fontFamily:"system-ui,sans-serif"}}>
      <div style={{background:"white",borderRadius:24,padding:32,width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,0.3)"}}>

        {/* Logo & Title */}
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{width:68,height:68,background:"linear-gradient(135deg,#4f46e5,#7c3aed)",borderRadius:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:32,margin:"0 auto 12px",boxShadow:"0 8px 24px rgba(79,70,229,0.4)"}}>📅</div>
          <div style={{fontWeight:800,fontSize:22,color:"#1e293b"}}>TimeTable Pro</div>
          <div style={{fontSize:13,color:"#94a3b8",marginTop:4}}>School Timetable Management</div>
        </div>



        {error&&<div style={{background:"#fff1f2",border:"1px solid #fecdd3",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#dc2626",marginBottom:14,lineHeight:1.5}}>⚠️ {error}</div>}
        {debugInfo&&<div style={{background:"#0f172a",borderRadius:10,padding:"10px 14px",fontSize:10,color:"#4ade80",marginBottom:14,lineHeight:1.6,fontFamily:"monospace",wordBreak:"break-all",maxHeight:200,overflowY:"auto"}}>{debugInfo}</div>}

        {/* Google Login */}
        {tab==="google"&&(
          <div>
            <button onClick={handleGoogleLogin} disabled={googleLoading}
              style={{width:"100%",background:"white",color:"#374151",border:"2px solid #e2e8f0",borderRadius:12,padding:"13px 16px",fontWeight:700,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:14,transition:"all 0.2s"}}
              onMouseEnter={e=>{e.target.style.borderColor="#4f46e5";e.target.style.background="#f8faff";}}
              onMouseLeave={e=>{e.target.style.borderColor="#e2e8f0";e.target.style.background="white";}}>
              {googleLoading ? "Redirecting to Google..." : (
                <>
                  <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                  </svg>
                  Continue with Google
                </>
              )}
            </button>

            {/* Divider */}
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
              <div style={{flex:1,height:1,background:"#e2e8f0"}}/>
              <span style={{fontSize:11,color:"#94a3b8",fontWeight:600}}>OR</span>
              <div style={{flex:1,height:1,background:"#e2e8f0"}}/>
            </div>

            {/* Demo Login */}
            <button onClick={handleDemoLogin}
              style={{width:"100%",background:"linear-gradient(135deg,#f0fdf4,#dcfce7)",color:"#166534",border:"2px solid #86efac",borderRadius:12,padding:"12px 16px",fontWeight:700,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:14}}>
              🎓 Try Demo Account
            </button>

            <div style={{fontSize:11,color:"#94a3b8",textAlign:"center",lineHeight:1.6}}>
              Your Google account email must be registered by the administrator to access the system.
            </div>
          </div>
        )}

        {/* Email login fallback */}
        <div style={{marginTop:16,textAlign:"center"}}>
          {tab==="google"
            ? <button onClick={()=>{setTab("email");setError("");}}
                style={{background:"none",border:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",textDecoration:"underline"}}>
                Sign in with email instead
              </button>
            : <div>
                <div style={{marginBottom:10}}>
                  <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleEmailLogin()}
                    placeholder="Enter your registered email"
                    style={{width:"100%",border:"2px solid #e2e8f0",borderRadius:12,padding:"11px 14px",fontSize:14,outline:"none",boxSizing:"border-box",marginBottom:8}}
                    onFocus={e=>e.target.style.borderColor="#4f46e5"}
                    onBlur={e=>e.target.style.borderColor="#e2e8f0"}/>
                  <button onClick={handleEmailLogin} disabled={loading||!email.trim()}
                    style={{width:"100%",background:email.trim()?"#4f46e5":"#e2e8f0",color:email.trim()?"white":"#94a3b8",border:"none",borderRadius:12,padding:12,fontWeight:700,fontSize:13,cursor:email.trim()?"pointer":"default"}}>
                    {loading?"Signing in...":"Sign In →"}
                  </button>
                </div>
                <button onClick={()=>{setTab("google");setError("");}}
                  style={{background:"none",border:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",textDecoration:"underline"}}>
                  ← Back to Google Login
                </button>
              </div>
          }
        </div>

        {/* Role info */}

      </div>
    </div>
  );
}

function SuperAdminScreen({currentUser, onSelectSchool, onLogout}) {
  const [schools,setSchools] = useState([]);
  const [users,setUsers]     = useState([]);
  const [loading,setLoading] = useState(true);
  const [tab,setTab]         = useState("schools");
  const [schoolForm,setSchoolForm] = useState(null);
  const [userForm,setUserForm]     = useState(null);
  const [saving,setSaving]         = useState(false);
  const [toast,setToast]           = useState("");

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(""),3000);}

  useEffect(()=>{load();},[]);

  async function load(){
    setLoading(true);
    const [sc,us] = await Promise.all([db.getSchools(), db.getAllUsers()]);
    setSchools(sc||[]); setUsers(us||[]);
    setLoading(false);
  }

  async function saveSchool(){
    setSaving(true);
    const d = {...schoolForm}; if(!d.id) delete d.id;
    await db.saveSchool(d);
    await load(); setSchoolForm(null); showToast("School saved!");
    setSaving(false);
  }

  async function deleteSchool(id){
    if(!window.confirm("Delete this school and ALL its data?")) return;
    await db.deleteSchool(id); await load(); showToast("Deleted");
  }

  async function saveUser(){
    setSaving(true);
    const d = {...userForm}; if(!d.id) delete d.id;
    d.email = (d.email||"").toLowerCase().trim();
    await db.saveUser(d);
    await load(); setUserForm(null); showToast("User saved!");
    setSaving(false);
  }

  async function deleteUser(id){
    if(!window.confirm("Delete this user?")) return;
    await db.deleteUser(id); await load();
  }

  return (
    <div style={{minHeight:"100vh",background:"#f8fafc",fontFamily:"system-ui,sans-serif"}}>
      {toast&&<div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:"#16a34a",color:"white",padding:"10px 20px",borderRadius:12,fontSize:13,fontWeight:700,zIndex:999}}>✓ {toast}</div>}

      <div style={{background:"#1e293b",color:"white",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,background:"#4f46e5",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>📅</div>
          <div>
            <div style={{fontWeight:700,fontSize:14}}>TimeTable Pro</div>
            <div style={{fontSize:11,opacity:0.6}}>Super Admin</div>
          </div>
        </div>
        <button onClick={onLogout} style={{background:"rgba(255,255,255,0.1)",border:"none",color:"white",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Sign Out</button>
      </div>

      <div style={{maxWidth:900,margin:"0 auto",padding:20}}>
        <div style={{display:"flex",gap:4,background:"#e2e8f0",borderRadius:12,padding:4,marginBottom:20,width:"fit-content"}}>
          {[{id:"schools",label:"🏫 Schools"},{id:"users",label:"👥 Users"}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)}
              style={{padding:"8px 20px",borderRadius:9,border:"none",cursor:"pointer",fontSize:13,fontWeight:700,
                background:tab===t.id?"white":"transparent",color:tab===t.id?"#4f46e5":"#64748b"}}>
              {t.label}
            </button>
          ))}
        </div>

        {tab==="schools"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:16,color:"#1e293b"}}>Schools ({schools.length})</div>
              <button onClick={()=>setSchoolForm({name:"",address:"",board:"",principal_name:"",start_time:"10:00",operation_days:"5"})}
                style={{background:"#4f46e5",color:"white",border:"none",borderRadius:10,padding:"8px 18px",fontWeight:700,fontSize:13,cursor:"pointer"}}>+ Add School</button>
            </div>
            {loading?<div style={{textAlign:"center",padding:40,color:"#94a3b8"}}>Loading...</div>:
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {schools.map(sc=>(
                <div key={sc.id} style={{background:"white",borderRadius:14,border:"1px solid #e2e8f0",padding:16,display:"flex",alignItems:"center",gap:14,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:15,color:"#1e293b"}}>{sc.name}</div>
                    <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{[sc.board,sc.address].filter(Boolean).join(" · ")}</div>
                    <div style={{fontSize:12,color:"#64748b",marginTop:1}}>Principal: {sc.principal_name||"Not set"}</div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>onSelectSchool(sc)} style={{background:"#eef2ff",color:"#4f46e5",border:"none",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Open →</button>
                    <button onClick={()=>setSchoolForm(sc)} style={{background:"#f8fafc",color:"#475569",border:"1px solid #e2e8f0",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer"}}>✏️</button>
                    <button onClick={()=>deleteSchool(sc.id)} style={{background:"#fff1f2",color:"#e11d48",border:"1px solid #fecdd3",borderRadius:8,padding:"6px 10px",fontSize:12,cursor:"pointer"}}>🗑</button>
                  </div>
                </div>
              ))}
              {schools.length===0&&<div style={{textAlign:"center",padding:40,color:"#94a3b8",border:"2px dashed #e2e8f0",borderRadius:16}}>No schools yet. Add your first school!</div>}
            </div>}
          </div>
        )}

        {tab==="users"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:16,color:"#1e293b"}}>Users ({users.length})</div>
              <button onClick={()=>setUserForm({email:"",name:"",role:"principal",school_id:""})}
                style={{background:"#4f46e5",color:"white",border:"none",borderRadius:10,padding:"8px 18px",fontWeight:700,fontSize:13,cursor:"pointer"}}>+ Add User</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {users.map(u=>{
                const sc = schools.find(s=>s.id===u.school_id);
                const roleColor = u.role==="super_admin"?"#4f46e5":u.role==="principal"?"#16a34a":"#d97706";
                const roleBg    = u.role==="super_admin"?"#eef2ff":u.role==="principal"?"#f0fdf4":"#fffbeb";
                return (
                  <div key={u.id} style={{background:"white",borderRadius:12,border:"1px solid #e2e8f0",padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                    <div style={{width:34,height:34,borderRadius:10,background:roleBg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
                      {u.role==="super_admin"?"🔵":u.role==="principal"?"🟢":"🟡"}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:13,color:"#1e293b"}}>{u.name||u.email}</div>
                      <div style={{fontSize:11,color:"#94a3b8"}}>{u.email}</div>
                      <div style={{display:"flex",gap:6,marginTop:3}}>
                        <span style={{fontSize:10,fontWeight:700,color:roleColor,background:roleBg,padding:"2px 8px",borderRadius:6}}>{u.role.replace("_"," ").toUpperCase()}</span>
                        {sc&&<span style={{fontSize:10,color:"#64748b",background:"#f8fafc",padding:"2px 8px",borderRadius:6,border:"1px solid #e2e8f0"}}>{sc.name}</span>}
                      </div>
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      <button onClick={()=>setUserForm(u)} style={{background:"#f8fafc",color:"#475569",border:"1px solid #e2e8f0",borderRadius:8,padding:"5px 10px",fontSize:11,cursor:"pointer"}}>✏️</button>
                      <button onClick={()=>deleteUser(u.id)} style={{background:"#fff1f2",color:"#e11d48",border:"1px solid #fecdd3",borderRadius:8,padding:"5px 10px",fontSize:11,cursor:"pointer"}}>🗑</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {schoolForm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"white",borderRadius:20,padding:24,width:"100%",maxWidth:440,boxShadow:"0 24px 64px rgba(0,0,0,0.3)",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontWeight:700,fontSize:16,color:"#1e293b",marginBottom:16}}>{schoolForm.id?"Edit School":"Add School"}</div>
            {[["name","School Name",true],["address","Address"],["board","Board"],["principal_name","Principal Name"],["start_time","Start Time"]].map(([k,label,req])=>(
              <div key={k} style={{marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:4}}>{label}{req&&" *"}</div>
                <input value={schoolForm[k]||""} onChange={e=>setSchoolForm(f=>({...f,[k]:e.target.value}))}
                  type={k==="start_time"?"time":"text"}
                  style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 10px",fontSize:13,boxSizing:"border-box"}}/>
              </div>
            ))}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:4}}>Operation Days</div>
              <select value={schoolForm.operation_days||"5"} onChange={e=>setSchoolForm(f=>({...f,operation_days:e.target.value}))}
                style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 10px",fontSize:13}}>
                <option value="5">5 Days (Mon–Fri)</option>
                <option value="6">6 Days (Mon–Sat)</option>
              </select>
            </div>
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <button onClick={()=>setSchoolForm(null)} style={{flex:1,border:"1px solid #e2e8f0",background:"white",color:"#64748b",borderRadius:10,padding:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>Cancel</button>
              <button onClick={saveSchool} disabled={saving||!schoolForm.name?.trim()}
                style={{flex:2,background:"#4f46e5",color:"white",border:"none",borderRadius:10,padding:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>
                {saving?"Saving...":"💾 Save"}
              </button>
            </div>
          </div>
        </div>
      )}

      {userForm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"white",borderRadius:20,padding:24,width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,0.3)"}}>
            <div style={{fontWeight:700,fontSize:16,color:"#1e293b",marginBottom:16}}>{userForm.id?"Edit User":"Add User"}</div>
            {[["email","Email",true],["name","Full Name"]].map(([k,label,req])=>(
              <div key={k} style={{marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:4}}>{label}{req&&" *"}</div>
                <input value={userForm[k]||""} onChange={e=>setUserForm(f=>({...f,[k]:e.target.value}))}
                  style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 10px",fontSize:13,boxSizing:"border-box"}}/>
              </div>
            ))}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:4}}>Role</div>
              <select value={userForm.role||"principal"} onChange={e=>setUserForm(f=>({...f,role:e.target.value}))}
                style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 10px",fontSize:13}}>
                <option value="super_admin">Super Admin</option>
                <option value="principal">Principal / Admin</option>
                <option value="class_teacher">Class Teacher</option>
              </select>
            </div>
            {userForm.role!=="super_admin"&&(
              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:4}}>School</div>
                <select value={userForm.school_id||""} onChange={e=>setUserForm(f=>({...f,school_id:e.target.value}))}
                  style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 10px",fontSize:13}}>
                  <option value="">Select School</option>
                  {schools.map(sc=><option key={sc.id} value={sc.id}>{sc.name}</option>)}
                </select>
              </div>
            )}
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <button onClick={()=>setUserForm(null)} style={{flex:1,border:"1px solid #e2e8f0",background:"white",color:"#64748b",borderRadius:10,padding:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>Cancel</button>
              <button onClick={saveUser} disabled={saving||!userForm.email?.trim()}
                style={{flex:2,background:"#4f46e5",color:"white",border:"none",borderRadius:10,padding:10,fontWeight:700,fontSize:13,cursor:"pointer"}}>
                {saving?"Saving...":"💾 Save"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════
// ROOT WITH AUTH + SESSION
// ═══════════════════════════════════
function Root() {
  const [currentUser,setCurrentUser]     = useState(null);
  const [currentSchool,setCurrentSchool] = useState(null);
  const [booting,setBooting]             = useState(true);

  useEffect(()=>{
    try {
      const saved = localStorage.getItem("tt_session");
      if(saved){ const s=JSON.parse(saved); setCurrentUser(s.user); setCurrentSchool(s.school); }
    } catch(e){}
    setBooting(false);
  },[]);

  function handleLogin(user,school){
    setCurrentUser(user); setCurrentSchool(school);
    localStorage.setItem("tt_session",JSON.stringify({user,school}));
  }
  function handleLogout(){
    setCurrentUser(null); setCurrentSchool(null);
    localStorage.removeItem("tt_session");
  }
  function handleSelectSchool(school){
    setCurrentSchool(school);
    localStorage.setItem("tt_session",JSON.stringify({user:currentUser,school}));
  }

  if(booting) return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#4f46e5"}}>
      <div style={{color:"white",fontSize:18,fontWeight:700}}>📅 Loading TimeTable Pro...</div>
    </div>
  );

  if(!currentUser)   return <LoginScreen onLogin={handleLogin}/>;

  if(currentUser.role==="super_admin"&&!currentSchool)
    return <SuperAdminScreen currentUser={currentUser} onSelectSchool={handleSelectSchool} onLogout={handleLogout}/>;

  return <App
    currentUser={currentUser}
    currentSchool={currentSchool||{}}
    onLogout={handleLogout}
    onSwitchSchool={currentUser.role==="super_admin"?()=>{setCurrentSchool(null);localStorage.setItem("tt_session",JSON.stringify({user:currentUser,school:null}));}:null}
  />;
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root/>);
</script>
</body>
</html>
