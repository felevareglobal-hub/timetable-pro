async function supa(method, table, body, params) {
  params = params || "";
  body   = body   || null;
  const url = SUPA_URL + "/rest/v1/" + table + (params ? "?" + params : "");
  const headers = {
    "apikey": SUPA_KEY,
    "Authorization": "Bearer " + SUPA_KEY,
    "Content-Type": "application/json",
    "Prefer": "return=representation",
  };
  const opts = { method, headers };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if(!res.ok) { const e = await res.text(); console.error("Supa error:", e); return null; }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

function getSlotMeta(type) { return SLOT_TYPES.find(s=>s.type===type)||SLOT_TYPES[1]; }

  let cur = startMins;

}

// ─── TIMETABLE GENERATOR ──────────────────────────────────────────────────────
function generateTimetable(standards, teachers, daySchedules, workingDays) {
  // Build subject→teachers map
  const subjTeachers = {};
  teachers.forEach(t => {
    (t.subjects||[]).forEach(s => {
      if(!subjTeachers[s]) subjTeachers[s]=[];
      subjTeachers[s].push(t.id);
    });
  });

  // teacher busy: {teacherId: {day: Set<slotIndex>}}
  const busy = {};
  teachers.forEach(t => { busy[t.id]={}; DAYS_FULL.forEach(d=>{ busy[t.id][d]=new Set(); }); });

  // timetable: {stdId+divId: {day: [null|{subject,teacherId}]}}
  const tt = {};
  standards.forEach(std => {
    (std.divisions||[]).forEach(div => {
      const key = `${std.id}_${div}`;
      tt[key] = {};
      workingDays.forEach(day => {
        const slots = daySchedules[day]?.slots || [];
        tt[key][day] = slots.map(slot => {
          if(isBreak(slot.type)||slot.type==="assembly") return {type:slot.type,label:slot.label||getSlotMeta(slot.type).label,fixed:true};
          return null;
        });
      });
    });
  });

  // Assign subjects to lecture slots
  standards.forEach(std => {
    (std.divisions||[]).forEach(div => {
      const key = `${std.id}_${div}`;
      // Get teachers assigned to this std+div
      const assignedTeachers = teachers.filter(t =>
        (t.assignments||[]).some(a => a.standardId===std.id && a.division===div)
      );
      // Build pool: for each teacher→subject assignment for this class
      let pool = [];
      assignedTeachers.forEach(t => {
        (t.assignments||[]).filter(a=>a.standardId===std.id&&a.division===div).forEach(a=>{
          for(let i=0;i<(a.periodsPerWeek||1);i++) pool.push({subject:a.subject,teacherId:t.id});
        });
      });
      pool = pool.sort(()=>Math.random()-0.5);
      let pi = 0;
      workingDays.forEach(day => {
        const slots = daySchedules[day]?.slots || [];
        slots.forEach((slot,si) => {
          if(slot.type==="lecture"||slot.type==="pt"||slot.type==="library"||slot.type==="activity"||slot.type==="free") {
            if(tt[key][day][si]===null) {
              // find next pool item where teacher not busy
              let assigned = false;
              for(let attempt=0;attempt<pool.length;attempt++) {
                const idx = (pi+attempt)%pool.length;
                const item = pool[idx];
                if(!busy[item.teacherId]?.[day]?.has(si)) {
                  tt[key][day][si] = {subject:item.subject,teacherId:item.teacherId,type:"lecture"};
                  busy[item.teacherId][day].add(si);
                  pi=(pi+1)%Math.max(pool.length,1);
                  assigned=true;
                  break;
                }
              }
              if(!assigned) tt[key][day][si]={subject:"—",teacherId:null,type:"lecture"};
            }
          }
        });
      });
    });
  });
  return tt;
}

      <Card>

          <div><Lbl>Saturday Working?</Lbl><Sel value={school.saturdayWorking?"yes":"no"} onChange={e=>upd("saturdayWorking",e.target.value==="yes")}><option value="no">No</option><option value="yes">Yes</option></Sel></div>
          <div><Lbl>School Start Time</Lbl><Inp type="time" value={school.startTime} onChange={e=>upd("startTime",e.target.value)}/></div>

        <div className="mt-4"><Lbl>Weekly Holidays</Lbl>

        </div>
      </Card>
    </div>
  );
}

// Standards & Divisions
function StandardsScreen({standards,setStandards,saveStandards}) {
  function addRow(){
    const updated=[...standards,{id:uid(),standard:"",section:"",numDivisions:1,divisions:["A"]}];
    setStandards(updated);
    if(saveStandards) saveStandards(updated);
  }
  function upd(id,k,v){
    setStandards(rows=>{
      const updated=rows.map(r=>{if(r.id!==id)return r;const u={...r,[k]:v};if(k==="numDivisions"){const n=parseInt(v)||1;u.divisions=DIVISIONS_LIST.slice(0,n);}return u;});
      if(saveStandards) saveStandards(updated);
      return updated;
    });
  }
  function remove(id){
    const updated=standards.filter(r=>r.id!==id);
    setStandards(updated);
    if(saveStandards) saveStandards(updated);
  }
  function addAll(){
    const ex=standards.map(r=>r.standard);
    const newRows=ALL_STANDARDS.filter(s=>!ex.includes(s)).map(s=>({
      id:uid(),standard:s,
      section:["Nursery","Jr. KG","Sr. KG"].includes(s)?"Pre-Primary":["Class 1","Class 2","Class 3","Class 4","Class 5"].includes(s)?"Primary":["Class 6","Class 7","Class 8","Class 9","Class 10"].includes(s)?"Secondary":"Higher Secondary",
      numDivisions:1,divisions:["A"]
    }));
    setStandards(s=>[...s,...newRows]);
  }
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h2 className="text-lg font-bold text-slate-800">Standards & Divisions</h2>
        <button onClick={addAll} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-2 rounded-lg border border-slate-300 transition">+ Add All (KG–12)</button>
      </div>
      <Card>
        {standards.length===0&&<EmptyState icon="🎓" title="No standards yet" sub="Add standards and their divisions" action="+ Add Standard" onAction={addRow}/>}
        {standards.length>0&&<div className="grid grid-cols-12 gap-2 mb-2 px-1"><div className="col-span-4 text-xs font-semibold text-slate-500">Standard</div><div className="col-span-3 text-xs font-semibold text-slate-500">Section</div><div className="col-span-2 text-xs font-semibold text-slate-500">Divisions</div><div className="col-span-2 text-xs font-semibold text-slate-500">Labels</div><div className="col-span-1"/></div>}
        <div className="space-y-2">
          {standards.map(row=>(
            <div key={row.id} className="grid grid-cols-12 gap-2 items-center bg-slate-50 rounded-xl px-3 py-2 border border-slate-100">
              <div className="col-span-4"><Sel value={row.standard} onChange={e=>upd(row.id,"standard",e.target.value)}><option value="">Select</option>{ALL_STANDARDS.map(s=><option key={s}>{s}</option>)}</Sel></div>
              <div className="col-span-3"><Sel value={row.section} onChange={e=>upd(row.id,"section",e.target.value)}><option value="">Section</option>{SECTIONS_LIST.map(s=><option key={s}>{s}</option>)}</Sel></div>
              <div className="col-span-2"><Sel value={row.numDivisions} onChange={e=>upd(row.id,"numDivisions",e.target.value)}>{[1,2,3,4,5,6].map(n=><option key={n} value={n}>{n}</option>)}</Sel></div>
              <div className="col-span-2 flex flex-wrap gap-1">{row.divisions.map(d=><span key={d} className="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">{d}</span>)}</div>
              <div className="col-span-1 flex justify-end"><button onClick={()=>remove(row.id)} className="text-slate-300 hover:text-red-500 text-xl transition">×</button></div>
            </div>
          ))}
        </div>
        {standards.length>0&&<button onClick={addRow} className="mt-3 w-full border-2 border-dashed border-indigo-200 hover:border-indigo-400 text-indigo-500 font-semibold text-sm py-2.5 rounded-xl transition">+ Add Standard</button>}
      </Card>
      {standards.length>0&&<div className="bg-indigo-50 border border-indigo-200 rounded-xl px-4 py-3 text-sm text-indigo-700"><span className="font-bold">{standards.length}</span> standards · <span className="font-bold">{standards.reduce((a,r)=>a+(r.divisions?.length||0),0)}</span> total divisions</div>}
    </div>
  );
}

// Schedule Builder
function ScheduleScreen({school,setSchool,daySchedules,setDaySchedules}) {
  const SECTIONS = ["Pre-Primary","Primary","Secondary","Higher Secondary"];
  const [activeSection,setActiveSection] = useState("Primary");
  const [activeDay,setActiveDay]         = useState("Monday");
  const [copyMode,setCopyMode]           = useState(false);
  const [copyTarget,setCopyTarget]       = useState([]);

  const workingDays = DAYS_FULL.filter(d=>
    d!=="Sunday" && !(d==="Saturday"&&!school.saturdayWorking)
  );

  // daySchedules structure: { "Primary_Monday": {slots:[]}, "Secondary_Tuesday": {slots:[]}, ... }
  function sectionDayKey(section,day){ return section+"_"+day; }

  function getSlotsFor(section,day){
    const key = sectionDayKey(section,day);
    // Fallback: if section not configured yet, use default weekday/saturday slots
    if(!daySchedules[key]){
      const globalKey = day; // old format fallback
      if(daySchedules[globalKey]) return daySchedules[globalKey].slots||[];
      return [];
    }
    return daySchedules[key].slots||[];
  }

  function updateSlots(section,day,slots){
    const key = sectionDayKey(section,day);
    setDaySchedules(p=>({...p,[key]:{slots}}));
  }

  function addSlot(section,day,type){
    const dur=type==="recess"?10:type==="lunch"?40:35;
    const current = getSlotsFor(section,day);
    updateSlots(section,day,[...current,{id:uid(),type,label:"",duration:dur}]);
  }

  function changeSlot(section,day,id,k,v){
    updateSlots(section,day,getSlotsFor(section,day).map(s=>s.id===id?{...s,[k]:v}:s));
  }

  function removeSlot(section,day,id){
    updateSlots(section,day,getSlotsFor(section,day).filter(s=>s.id!==id));
  }

  function moveSlot(section,day,idx,dir){
    const arr=[...getSlotsFor(section,day)];
    const t=idx+dir; if(t<0||t>=arr.length)return;
    [arr[idx],arr[t]]=[arr[t],arr[idx]];
    updateSlots(section,day,arr);
  }

  function copyDayTo(targets){
    const src=getSlotsFor(activeSection,activeDay);
    setDaySchedules(p=>{
      const u={...p};
      targets.forEach(d=>{
        const key=sectionDayKey(activeSection,d);
        u[key]={slots:src.map(s=>({...s,id:uid()}))};
      });
      return u;
    });
    setCopyMode(false); setCopyTarget([]);
  }

  function copySectionTo(targetSection){
    // Copy entire section schedule from activeSection to targetSection
    setDaySchedules(p=>{
      const u={...p};
      workingDays.forEach(day=>{
        const src=getSlotsFor(activeSection,day);
        const key=sectionDayKey(targetSection,day);
        u[key]={slots:src.map(s=>({...s,id:uid()}))};
      });
      return u;
    });
  }

  const slots    = getSlotsFor(activeSection,activeDay);
  const startMins= timeToMins(school.startTime||"10:00");
  const computed = computeSlots(slots,startMins);
  const totalMins= slots.reduce((a,s)=>a+s.duration,0);
  let pNum=0;
  const withNum  = computed.map(s=>({...s,periodNumber:isBreak(s.type)||s.type==="assembly"?null:++pNum}));
  const lectureCount = slots.filter(s=>!isBreak(s.type)).length;

  // Weekly overview for active section
  const weeklyPeriods = workingDays.reduce((a,d)=>a+getSlotsFor(activeSection,d).filter(s=>!isBreak(s.type)).length,0);

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <h2 style={{margin:0,fontSize:17,fontWeight:700,color:"#1e293b"}}>Schedule & Timings</h2>

      {/* School start time */}
      <div style={{background:"white",borderRadius:14,border:"1px solid #e2e8f0",padding:14,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
        <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div style={{flex:"1 1 160px"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:4}}>School Start Time</div>
            <Inp type="time" value={school.startTime||"10:00"} onChange={e=>setSchool(s=>({...s,startTime:e.target.value}))}/>
            <div style={{fontSize:10,color:"#94a3b8",marginTop:3}}>All sections calculate from this</div>
          </div>
          <div style={{flex:"1 1 160px"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:4}}>Saturday Working</div>
            <Sel value={school.saturdayWorking?"yes":"no"} onChange={e=>setSchool(s=>({...s,saturdayWorking:e.target.value==="yes"}))}>
              <option value="no">No (Holiday)</option>
              <option value="yes">Yes (Working)</option>
            </Sel>
          </div>
        </div>
      </div>

      {/* Section tabs */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {SECTIONS.map(sec=>{
          const secPeriods = workingDays.reduce((a,d)=>a+getSlotsFor(sec,d).filter(s=>!isBreak(s.type)).length,0);
          const isActive   = activeSection===sec;
          return(
            <button key={sec} onClick={()=>{setActiveSection(sec);setActiveDay("Monday");}}
              style={{padding:"8px 16px",borderRadius:12,border:`2px solid ${isActive?"#4f46e5":"#e2e8f0"}`,
                background:isActive?"#4f46e5":"white",color:isActive?"white":"#475569",
                fontSize:12,fontWeight:700,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
              <span>{sec}</span>
              <span style={{fontSize:10,opacity:0.75}}>{secPeriods}p/wk</span>
            </button>
          );
        })}
      </div>

      {/* Copy section helper */}
      <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:10,padding:"8px 14px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:11,color:"#64748b",fontWeight:600}}>📋 Copy {activeSection} schedule to:</span>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {SECTIONS.filter(s=>s!==activeSection).map(sec=>(
            <button key={sec} onClick={()=>{
              if(window.confirm("Copy "+activeSection+" full schedule to "+sec+"? This will overwrite "+sec+"'s schedule."))
                copySectionTo(sec);
            }}
              style={{background:"white",border:"1px solid #c7d2fe",color:"#4f46e5",borderRadius:8,padding:"4px 12px",fontSize:11,fontWeight:700,cursor:"pointer"}}>
              {sec}
            </button>
          ))}
        </div>
      </div>

      {/* Day tabs for active section */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {workingDays.map(day=>{
          const s=getSlotsFor(activeSection,day);
          const p=s.filter(x=>!isBreak(x.type)).length;
          const isAct=activeDay===day;
          return(
            <button key={day} onClick={()=>setActiveDay(day)}
              style={{flexDirection:"column",display:"flex",alignItems:"center",padding:"8px 14px",borderRadius:10,
                border:`2px solid ${isAct?"#6366f1":"#e2e8f0"}`,
                background:isAct?"#6366f1":"white",color:isAct?"white":"#64748b",
                fontSize:11,fontWeight:700,cursor:"pointer",gap:2}}>
              <span>{day.slice(0,3)}</span>
              <span style={{fontSize:10,opacity:0.7}}>{p}p</span>
            </button>
          );
        })}
      </div>

      {/* Day editor */}
      <div style={{background:"white",borderRadius:14,border:"1px solid #e2e8f0",padding:14,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
        {/* Section + Day header */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
          <div>
            <div style={{fontWeight:700,fontSize:13,color:"#1e293b"}}>{activeSection} — {activeDay}</div>
            <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>
              Starts {minsToTime(startMins)} · {lectureCount} periods · Ends {minsToTime(startMins+totalMins)}
            </div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {!copyMode
              ? <button onClick={()=>setCopyMode(true)}
                  style={{background:"#f8fafc",border:"1px solid #e2e8f0",color:"#64748b",borderRadius:8,padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer"}}>
                  📋 Copy to Days
                </button>
              : <div style={{display:"flex",alignItems:"center",gap:6,background:"#eef2ff",border:"1px solid #c7d2fe",borderRadius:10,padding:"5px 10px",flexWrap:"wrap"}}>
                  <span style={{fontSize:11,color:"#4f46e5",fontWeight:700}}>Copy to:</span>
                  {workingDays.filter(d=>d!==activeDay).map(d=>(
                    <button key={d} onClick={()=>setCopyTarget(p=>p.includes(d)?p.filter(x=>x!==d):[...p,d])}
                      style={{padding:"3px 10px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,
                        background:copyTarget.includes(d)?"#4f46e5":"white",
                        color:copyTarget.includes(d)?"white":"#6366f1"}}>
                      {d.slice(0,3)}
                    </button>
                  ))}
                  <button onClick={()=>copyDayTo(copyTarget)} disabled={!copyTarget.length}
                    style={{background:"#4f46e5",color:"white",border:"none",borderRadius:7,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:"pointer",opacity:copyTarget.length?1:0.4}}>
                    Apply
                  </button>
                  <button onClick={()=>{setCopyMode(false);setCopyTarget([]);}}
                    style={{background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:14}}>✕</button>
                </div>
            }
            <button onClick={()=>updateSlots(activeSection,activeDay,[])}
              style={{background:"#fff1f2",border:"1px solid #fecdd3",color:"#e11d48",borderRadius:8,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>
              🗑 Clear
            </button>
          </div>
        </div>

        {/* Timeline bar */}
        <TimelineBar computed={withNum} totalMins={Math.max(totalMins,1)}/>

        {/* Slot rows */}
        <div style={{display:"flex",flexDirection:"column",gap:6,margin:"10px 0"}}>
          {slots.length===0&&(
            <div style={{textAlign:"center",padding:"24px 0",color:"#94a3b8",fontSize:13,border:"2px dashed #e2e8f0",borderRadius:12}}>
              No periods yet — add below
            </div>
          )}
          {withNum.map((slot,i)=>{
            const meta=getSlotMeta(slot.type);
            return(
              <div key={slot.id} style={{display:"flex",alignItems:"center",gap:6,background:meta.color.includes("amber")?"#fffbeb":meta.color.includes("green")?"#f0fdf4":meta.color.includes("orange")?"#fff7ed":meta.color.includes("indigo")?"#eef2ff":"#f8fafc",border:"1px solid #e2e8f0",borderRadius:10,padding:"7px 10px"}}>
                <div style={{display:"flex",flexDirection:"column",gap:1}}>
                  <button onClick={()=>moveSlot(activeSection,activeDay,i,-1)} disabled={i===0}
                    style={{background:"none",border:"none",cursor:"pointer",fontSize:9,color:"#94a3b8",padding:0,lineHeight:1,opacity:i===0?0.2:1}}>▲</button>
                  <button onClick={()=>moveSlot(activeSection,activeDay,i,1)} disabled={i===slots.length-1}
                    style={{background:"none",border:"none",cursor:"pointer",fontSize:9,color:"#94a3b8",padding:0,lineHeight:1,opacity:i===slots.length-1?0.2:1}}>▼</button>
                </div>
                <span style={{fontSize:14,flexShrink:0}}>{meta.icon}</span>
                {!isBreak(slot.type)&&<span style={{fontSize:10,fontWeight:700,color:"#94a3b8",width:16,textAlign:"center",flexShrink:0}}>{slot.periodNumber}</span>}
                <select value={slot.type} onChange={e=>changeSlot(activeSection,activeDay,slot.id,"type",e.target.value)}
                  style={{border:"none",background:"transparent",fontSize:11,fontWeight:700,cursor:"pointer",color:"#374151",maxWidth:110}}>
                  {SLOT_TYPES.map(t=><option key={t.type} value={t.type}>{t.icon} {t.label}</option>)}
                </select>
                <input value={slot.label} onChange={e=>changeSlot(activeSection,activeDay,slot.id,"label",e.target.value)}
                  placeholder={meta.label}
                  style={{flex:1,border:"none",background:"rgba(255,255,255,0.7)",borderRadius:6,padding:"4px 8px",fontSize:11,outline:"none",minWidth:0}}/>
                <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
                  <input type="number" min={5} max={120} step={5} value={slot.duration}
                    onChange={e=>changeSlot(activeSection,activeDay,slot.id,"duration",parseInt(e.target.value)||35)}
                    style={{width:44,border:"none",background:"rgba(255,255,255,0.7)",borderRadius:6,padding:"4px 6px",fontSize:11,fontWeight:700,textAlign:"center"}}/>
                  <span style={{fontSize:10,color:"#94a3b8"}}>min</span>
                </div>
                <span style={{fontSize:9,color:"#94a3b8",fontFamily:"monospace",flexShrink:0,display:"none"}}
                  ref={el=>{if(el)el.style.display="block"}}>
                  {minsToTime(slot.startMins)}–{minsToTime(slot.endMins)}
                </span>
                <button onClick={()=>removeSlot(activeSection,activeDay,slot.id)}
                  style={{background:"none",border:"none",color:"#fca5a5",cursor:"pointer",fontSize:18,lineHeight:1,padding:"0 2px",flexShrink:0}}>×</button>
              </div>
            );
          })}
        </div>

        {/* Add slot buttons */}
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {SLOT_TYPES.map(t=>(
            <button key={t.type} onClick={()=>addSlot(activeSection,activeDay,t.type)}
              style={{background:"white",border:"1px solid #e2e8f0",color:"#475569",borderRadius:20,padding:"5px 12px",fontSize:11,fontWeight:600,cursor:"pointer"}}>
              + {t.icon} {t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Weekly overview for active section */}
      <div style={{background:"white",borderRadius:14,border:"1px solid #e2e8f0",padding:14,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
        <div style={{fontWeight:700,fontSize:12,color:"#64748b",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>{activeSection} — Weekly Overview</div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {workingDays.map(day=>{
            const s   = getSlotsFor(activeSection,day);
            const tm  = s.reduce((a,x)=>a+x.duration,0);
            const comp= computeSlots(s,startMins);
            const p   = s.filter(x=>!isBreak(x.type)).length;
            return(
              <div key={day} style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:34,fontSize:11,fontWeight:700,color:"#64748b",flexShrink:0}}>{day.slice(0,3)}</div>
                <div style={{flex:1}}><TimelineBar computed={comp} totalMins={Math.max(tm,1)}/></div>
                <div style={{fontSize:11,color:"#475569",fontWeight:700,flexShrink:0,width:16,textAlign:"right"}}>{p}p</div>
                <div style={{fontSize:10,color:"#94a3b8",flexShrink:0,width:60,textAlign:"right"}}>→ {minsToTime(startMins+tm)}</div>
              </div>
            );
          })}
        </div>
        {/* Legend */}
        <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:12,paddingTop:10,borderTop:"1px solid #f1f5f9"}}>
          {SLOT_TYPES.map(t=>(
            <div key={t.type} style={{display:"flex",alignItems:"center",gap:4}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:t.dot.replace("bg-","")}}/>
              <span style={{fontSize:10,color:"#94a3b8"}}>{t.label}</span>
            </div>
          ))}
        </div>
      </div>

      {/* All sections summary */}
      <div style={{background:"white",borderRadius:14,border:"1px solid #e2e8f0",padding:14,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
        <div style={{fontWeight:700,fontSize:12,color:"#64748b",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>All Sections Summary</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {SECTIONS.map(sec=>{
            const total = workingDays.reduce((a,d)=>a+getSlotsFor(sec,d).filter(s=>!isBreak(s.type)).length,0);
            const configured = workingDays.some(d=>getSlotsFor(sec,d).length>0);
            return(
              <div key={sec} onClick={()=>setActiveSection(sec)}
                style={{background:configured?"#f0fdf4":"#fff7ed",border:`1px solid ${configured?"#bbf7d0":"#fed7aa"}`,
                  borderRadius:10,padding:"10px 14px",cursor:"pointer",
                  outline:activeSection===sec?"2px solid #4f46e5":"none"}}>
                <div style={{fontWeight:700,fontSize:12,color:configured?"#166534":"#9a3412"}}>{sec}</div>
                <div style={{fontSize:11,color:configured?"#16a34a":"#f59e0b",marginTop:2}}>
                  {configured ? total+" periods/week ✓" : "Not configured yet"}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// Subjects
function SubjectsScreen({subjects,setSubjects,saveSubjects}) {
  const [newSubj,setNewSubj]=useState("");
  function add(){
    const t=newSubj.trim();
    if(!t||subjects.includes(t))return;
    const updated=[...subjects,t];
    setSubjects(updated);
    if(saveSubjects) saveSubjects(updated);
    setNewSubj("");
  }
  function remove(i){
    const updated=subjects.filter((_,idx)=>idx!==i);
    setSubjects(updated);
    if(saveSubjects) saveSubjects(updated);
  }
  return (
    <div className="space-y-4">
      <h2 className="text-lg font-bold text-slate-800">Subjects</h2>
      <Card>
        <SecTitle icon="📚" title="Subject Master List" sub="All subjects taught in your school"/>
        <div className="flex gap-2 mb-4"><Inp value={newSubj} onChange={e=>setNewSubj(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Type subject name and press Enter"/><button onClick={add} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition flex-shrink-0">+ Add</button></div>
        <div className="mb-4">
          <div className="text-xs text-slate-400 font-semibold mb-2">Quick Add:</div>
          <div className="flex flex-wrap gap-2">{COMMON_SUBJECTS.map(s=><button key={s} onClick={()=>{if(!subjects.includes(s))setSubjects(p=>[...p,s]);}} className={`text-xs px-3 py-1 rounded-full border font-medium transition ${subjects.includes(s)?"bg-green-100 text-green-700 border-green-300 cursor-default":"bg-white text-slate-600 border-slate-300 hover:border-indigo-400 hover:text-indigo-600"}`}>{subjects.includes(s)?"✓ ":"+ "}{s}</button>)}</div>
        </div>
        {subjects.length===0?<EmptyState icon="📚" title="No subjects yet" sub="Add subjects your school teaches"/>:
        <div className="flex flex-wrap gap-2">{subjects.map((s,i)=><div key={i} className="flex items-center gap-1.5 bg-indigo-50 border border-indigo-200 text-indigo-800 text-xs font-semibold px-3 py-1.5 rounded-full"><span>{s}</span><button onClick={()=>remove(i)} className="text-indigo-300 hover:text-red-500 text-sm font-bold transition">×</button></div>)}</div>}
      </Card>
    </div>
  );
}

// Teachers
function TeachersScreen({teachers,setTeachers,subjects,standards}) {
  const [editing,setEditing] = useState(null);
  const [form,setForm]       = useState({});

  function openNew(){
    setForm({id:uid(),name:"",address:"",whatsapp:"",emergency:"",bloodGroup:"",photo:"",subjects:[],assignments:[]});
    setEditing("new");
  }
  function openEdit(t){setForm(JSON.parse(JSON.stringify(t)));setEditing(t.id);}
  async function saveTeacher(){
    if(!form.name?.trim()) return;
    let savedForm = {...form};
    // Save to Supabase
    if(saveTeacherToDb){
      const tid = await saveTeacherToDb(form);
      if(tid&&editing==="new") savedForm={...form,id:tid};
    }
    if(editing==="new") setTeachers(t=>[...t,savedForm]);
    else setTeachers(t=>t.map(x=>x.id===editing?savedForm:x));
    setEditing(null);
  }
  function deleteTeacher(id){setTeachers(t=>t.filter(x=>x.id!==id));}

  // Toggle subject — also remove assignments for that subject if deselected
  function toggleSubject(s){
    setForm(f=>{
      const curr = Array.isArray(f.subjects)?f.subjects:[];
      const has  = curr.includes(s);
      return {
        ...f,
        subjects: has ? curr.filter(x=>x!==s) : [...curr,s],
        assignments: has ? (f.assignments||[]).filter(a=>a.subject!==s) : (f.assignments||[]),
      };
    });
  }

  // Add assignment row for a subject+class+division
  function addAssignment(subject, standardId, division){
    if(!subject||!standardId||!division) return;
    const exists = (form.assignments||[]).some(
      a=>a.subject===subject&&a.standardId===standardId&&a.division===division
    );
    if(exists) return;
    setForm(f=>({
      ...f,
      assignments:[...(f.assignments||[]),{id:uid(),subject,standardId,division,periodsPerWeek:2}]
    }));
  }

  function updateAssignment(id,key,val){
    setForm(f=>({...f,assignments:(f.assignments||[]).map(a=>a.id===id?{...a,[key]:val}:a)}));
  }
  function removeAssignment(id){
    setForm(f=>({...f,assignments:(f.assignments||[]).filter(a=>a.id!==id)}));
  }

  // ── Teacher Form ──
  if(editing!==null){
    const selectedSubjects = form.subjects||[];
    const assignments      = form.assignments||[];

      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {/* Back + Title */}

          <button onClick={()=>setEditing(null)}
            style={{background:"#f1f5f9",border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,color:"#475569",cursor:"pointer"}}>
            ← Back
          </button>
          <h2 style={{margin:0,fontSize:16,fontWeight:700,color:"#1e293b"}}>
            {editing==="new"?"Add Teacher":"Edit Teacher"}
          </h2>
        </div>

        {/* ── Personal Details ── */}
        <div style={{background:"white",borderRadius:16,border:"1px solid #e2e8f0",padding:16,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
            <div style={{width:28,height:28,background:"#eef2ff",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>👤</div>
            <div style={{fontWeight:700,fontSize:13,color:"#1e293b"}}>Personal Details</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:3}}>Full Name <span style={{color:"#f87171"}}>*</span></div>
              <Inp value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. Mrs. Priya Sharma"/>
            </div>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:3}}>Address</div>
              <textarea style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 10px",fontSize:13,resize:"none",background:"white",fontFamily:"inherit"}}

            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:3}}>WhatsApp No.</div>

              <div>

                        const reader = new FileReader();
                        reader.onload = ev => {
                          // Compress image using canvas
                          const img = new Image();
                          img.onload = () => {
                            const canvas = document.createElement("canvas");
                            const MAX = 200;
                            let w = img.width, h = img.height;
                            if(w > h){ if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} }
                            else { if(h>MAX){w=Math.round(w*MAX/h);h=MAX;} }
                            canvas.width=w; canvas.height=h;
                            canvas.getContext("2d").drawImage(img,0,0,w,h);
                            const compressed = canvas.toDataURL("image/jpeg",0.75);
                            setForm(f=>({...f,photo:compressed}));
                          };
                          img.src = ev.target.result;
                        };

// Helper: inline row to add a class/division for a subject
function AddClassRow({subj,standards,onAdd,existing}){
  const [stdId,setStdId] = useState("");
  const [div,setDiv]     = useState("");
  const std = standards.find(s=>s.id===stdId);

  function handleAdd(){
    if(!stdId||!div) return;
    onAdd(subj,stdId,div);
    setStdId(""); setDiv("");
  }

  return(
    <div style={{display:"flex",gap:6,alignItems:"flex-end",flexWrap:"wrap"}}>
      <div style={{flex:"1 1 120px"}}>
        <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",marginBottom:3}}>Standard</div>
        <select value={stdId} onChange={e=>{setStdId(e.target.value);setDiv("");}}
          style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"6px 8px",fontSize:12,background:"white"}}>
          <option value="">Select Class</option>
          {standards.map(s=><option key={s.id} value={s.id}>{s.standard}</option>)}
        </select>
      </div>
      <div style={{flex:"1 1 80px"}}>
        <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",marginBottom:3}}>Division</div>
        <select value={div} onChange={e=>setDiv(e.target.value)}
          style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:8,padding:"6px 8px",fontSize:12,background:"white"}}>
          <option value="">Div</option>
          {(std?.divisions||[]).map(d=><option key={d}>{d}</option>)}
        </select>
      </div>
      <button onClick={handleAdd} disabled={!stdId||!div}
        style={{background:stdId&&div?"#4f46e5":"#e2e8f0",color:stdId&&div?"white":"#94a3b8",
          border:"none",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,
          cursor:stdId&&div?"pointer":"default",whiteSpace:"nowrap",flexShrink:0}}>
        + Add Class
      </button>
    </div>
  );
}

  const [classTeachers,setClassTeachers] = useState({}); // {key: teacherId}

    d !== "Sunday" && !(d === "Saturday" && !school.saturdayWorking)
  );
  const startMins = timeToMins(school.startTime || "10:00");

  // Section-aware slot lookup
  function getSlotsForSection(section, day) {
    const secKey = section + "_" + day;
    if(daySchedules[secKey]) return daySchedules[secKey].slots || [];
    // Fallback to global key (old format)
    return daySchedules[day]?.slots || [];
  }

  // Get section for a standard
  function getSectionForStd(std) {
    const name = std.standard || "";
    if(["Nursery","Jr. KG","Sr. KG"].includes(name)) return "Pre-Primary";
    if(["Class 1","Class 2","Class 3","Class 4","Class 5"].includes(name)) return "Primary";
    if(["Class 6","Class 7","Class 8","Class 9","Class 10"].includes(name)) return "Secondary";
    if(["Class 11","Class 12"].includes(name)) return "Higher Secondary";
    return std.section || "Primary";
  }

  const refDay   = workingDays[0] || "Monday";
  const refSlots = daySchedules["Primary_"+refDay]?.slots || daySchedules[refDay]?.slots || [];
  const refTimes = (()=>{ let c=startMins; return refSlots.map(s=>{const st=c;c+=s.duration;return{start:st,end:c};}); })();

  const allKeys = [];
  standards.forEach(std => {
    (std.divisions||[]).forEach(div => {
      allKeys.push({key:`${std.id}_${div}`,label:`${std.standard} – ${div}`,stdId:std.id,div,stdName:std.standard,std});
    });
  });

  // Get section for standard
  function getSection(std) {
    const name = std?.standard||"";
    if(["Nursery","Jr. KG","Sr. KG"].includes(name)) return "Pre-Primary";
    if(["Class 1","Class 2","Class 3","Class 4","Class 5"].includes(name)) return "Primary";
    if(["Class 6","Class 7","Class 8","Class 9","Class 10"].includes(name)) return "Secondary";
    if(["Class 11","Class 12"].includes(name)) return "Higher Secondary";
    return std?.section||"Primary";
  }

  function getSlotsForDisplay(std, day) {
    const sec = getSection(std);
    const secKey = sec+"_"+day;
    if(daySchedules[secKey]) return daySchedules[secKey].slots||[];
    return daySchedules[day]?.slots||[];
  }

  // ── Generator ──
  // Logic: teacher assignments drive ALL timetables simultaneously
  // Each teacher's periods are placed across all their assigned classes
  // Cross-class conflict check: teacher cannot be in 2 classes at same day+slot
  function generate() {
    const log = [];
    log.push(`Generating for ${standards.length} standards, ${teachers.length} teachers`);

    // Step 1: Initialize all class timetables with fixed slots
    const tt = {};
    const allClassKeys = [];
    standards.forEach(std => {
      (std.divisions||[]).forEach(div => {
        const key = `${std.id}_${div}`;
        allClassKeys.push({key, std});
        tt[key] = {};
        const section = getSectionForStd(std);
        workingDays.forEach(day => {
          const slots = getSlotsForSection(section, day);
          tt[key][day] = slots.map(slot => {
            if(["assembly","recess","lunch","pt","library","activity"].includes(slot.type))
              return {fixed:true, type:slot.type, label:slot.label||slot.type};
            return null;
          });
        });
      });
    });

    log.push(`Initialized ${allClassKeys.length} class timetables`);

    // Step 2: Global teacher busy tracker
    // busy[teacherId][day] = Set of slot indices already assigned
    const busy = {};
    teachers.forEach(t => {
      busy[t.id] = {};
      workingDays.forEach(d => { busy[t.id][d] = new Set(); });
    });

    // Step 3: Build master assignment list
    // Each entry = one period to place for a specific teacher in a specific class
    // Strictly respects periodsPerWeek — no cycling
    const masterPool = [];
    teachers.forEach(t => {
      (t.assignments||[]).forEach(a => {
        const std = standards.find(s=>s.id===a.standardId);
        if(!std) return;
        const key = `${a.standardId}_${a.division}`;
        if(!tt[key]) return;
        const ppw = parseInt(a.periodsPerWeek)||1;
        log.push(`  ${t.name} → ${std.standard} Div ${a.division} → ${a.subject} × ${ppw} periods/week`);
        for(let i=0;i<ppw;i++){
          masterPool.push({
            teacherId: t.id,
            tname:     t.name,
            subject:   a.subject,
            classKey:  key,
            className: `${std.standard}-${a.division}`,
          });
        }
      });
    });

    log.push(`Master pool: ${masterPool.length} total periods to place across all classes`);

    // Step 4: Shuffle master pool for fair random distribution
    masterPool.sort(()=>Math.random()-0.5);

    // Step 5: Build all available lecture positions per class
    const positions = {};
    allClassKeys.forEach(({key,std}) => {
      positions[key] = [];
      const section = getSectionForStd(std);
      workingDays.forEach(day => {
        const slots = getSlotsForSection(section,day);
        slots.forEach((slot,si) => {
          if(slot.type==="lecture") positions[key].push({day,si});
        });
      });
      positions[key].sort(()=>Math.random()-0.5);
    });

    // Step 6: Place each pool entry
    // Rules (in priority order):
    //   1. Slot must be empty in this class
    //   2. Teacher must not be teaching another class at this day+slot (global conflict)
    //   3. PREFERRED: teacher should NOT have a period in the adjacent slot (prev or next)
    //      in the SAME class — avoid back-to-back in same class
    //   If no non-back-to-back slot found, fall back to any valid slot

    // Helper: check if teacher already has a period immediately before or after si in same class
    function isBackToBack(classKey, teacherId, day, si) {
      const daySlots = tt[classKey][day] || [];
      const prev = si > 0 ? daySlots[si-1] : null;
      const next = si < daySlots.length-1 ? daySlots[si+1] : null;
      // Back-to-back if adjacent slot has same teacher AND is a lecture (not fixed)
      const prevBad = prev && !prev.fixed && prev.teacherId === teacherId;
      const nextBad = next && !next.fixed && next.teacherId === teacherId;
      return prevBad || nextBad;
    }

    const unplaced = [];

    for(const item of masterPool){
      const classPositions = positions[item.classKey];
      let placed = false;

      // --- Pass 1: Try to find a slot that is valid AND not back-to-back ---
      for(let i=0; i<classPositions.length; i++){
        const pos = classPositions[i];
        const slotEmpty   = tt[item.classKey][pos.day][pos.si] === null;
        const teacherFree = !busy[item.teacherId][pos.day].has(pos.si);
        const backToBack  = isBackToBack(item.classKey, item.teacherId, pos.day, pos.si);

        if(slotEmpty && teacherFree && !backToBack){
          tt[item.classKey][pos.day][pos.si] = {
            subject:   item.subject,
            teacherId: item.teacherId,
            tname:     item.tname,
          };
          busy[item.teacherId][pos.day].add(pos.si);
          classPositions.splice(i,1);
          placed = true;
          break;
        }
      }

      // --- Pass 2: Fallback — place anywhere valid (ignore back-to-back preference) ---
      if(!placed){
        for(let i=0; i<classPositions.length; i++){
          const pos = classPositions[i];
          const slotEmpty   = tt[item.classKey][pos.day][pos.si] === null;
          const teacherFree = !busy[item.teacherId][pos.day].has(pos.si);

          if(slotEmpty && teacherFree){
            tt[item.classKey][pos.day][pos.si] = {
              subject:   item.subject,
              teacherId: item.teacherId,
              tname:     item.tname,
            };
            busy[item.teacherId][pos.day].add(pos.si);
            classPositions.splice(i,1);
            placed = true;
            log.push(`  ⚡ Back-to-back fallback used: ${item.tname} / ${item.subject} in ${item.className}`);
            break;
          }
        }
      }

      if(!placed){
        unplaced.push(item);
        log.push(`⚠️ Could not place: ${item.tname} / ${item.subject} in ${item.className}`);
      }
    }

    // Step 7: Summary
    allClassKeys.forEach(({key,std: s}) => {
      const div = key.split("_").pop();
      const section = getSectionForStd(s);
      const filled = workingDays.reduce((a,day)=>
        a+(tt[key][day]||[]).filter(c=>c&&!c.fixed&&c.subject).length,0);
      const total = workingDays.reduce((a,day)=>
        a+getSlotsForSection(section,day).filter(sl=>sl.type==="lecture").length,0);
      log.push(`${s?.standard||key}-${div}: ${filled}/${total} lecture slots filled`);
    });

    if(unplaced.length===0) log.push("✅ All periods placed successfully!");
    else log.push(`⚠️ ${unplaced.length} periods could not be placed (teacher conflicts or insufficient slots)`);

    setTimetable(tt);
    setDebugLog(log);
    if(allKeys.length) setActiveKey(allKeys[0].key);
    // Auto-save to Supabase
    if(saveTimetableToDb) saveTimetableToDb(tt, classTeachers);
  }

  // ── Manual cell edit ──
  function saveEdit(newSubject, newTeacherId) {
    if(!editCell) return;
    const {key,day,si} = editCell;
    const t = teachers.find(x=>x.id===newTeacherId);
    setTimetable(prev => {
      const updated = JSON.parse(JSON.stringify(prev));
      updated[key][day][si] = {subject:newSubject, teacherId:newTeacherId, tname:t?.name||""};
      if(saveTimetableToDb) saveTimetableToDb(updated, classTeachers);
      return updated;
    });
    setEditCell(null);
  }

  // ── Export CSV (data URI method - works in sandboxed iframe) ──
  function exportCSV(key) {
    if(!timetable||!timetable[key]) return;
    const info = allKeys.find(k=>k.key===key);
    const ctId = classTeachers[key];
    const ct   = teachers.find(t=>t.id===ctId);
    let csv = `School:,${school.name}\nBoard:,${school.board}\nClass:,${info?.label}\nClass Teacher:,${ct?.name||"Not assigned"}\n\n`;
    csv += `Time,${workingDays.join(",")}\n`;
    refSlots.forEach((slot,si) => {
      const time = minsToTime(refTimes[si]?.start||startMins);
      const row  = workingDays.map(day => {
        const cell = (timetable[key][day]||[])[si];
        if(!cell) return "";
        if(cell.fixed) return cell.label||cell.type;
        return `${cell.subject}${cell.tname?" ("+cell.tname+")":""}`;
      });
      csv += `${time},${row.join(",")}\n`;
    });
    // Use data URI instead of blob URL (works in sandboxed iframes)
    const encoded = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    const a = document.createElement("a");
    a.setAttribute("href", encoded);
    a.setAttribute("download", `timetable_${(info?.label||"class").replace(/\s/g,"_")}.csv`);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // ── Print: show inline print panel ──
  const [printKey,setPrintKey] = useState(null);
  function printTimetable(key) { setPrintKey(key===printKey?null:key); }

  // ── WhatsApp Share ──
  function shareWhatsApp(key) {
    if(!timetable||!timetable[key]) return;
    const info    = allKeys.find(k=>k.key===key);
    const ctId    = classTeachers[key];
    const ct      = teachers.find(t=>t.id===ctId);
    const stdObj  = standards.find(s=>s.id===info?.stdId);
    const section = stdObj?.section||"";

    function getSlots(day) {
      const sec = section||"Primary";
      const sk  = sec+"_"+day;
      if(daySchedules[sk]) return daySchedules[sk].slots||[];
      return daySchedules[day]?.slots||[];
    }

    const lines = [];
    lines.push("📅 *TIMETABLE — "+school.name+"*");
    lines.push("🏫 Board: "+(school.board||""));
    lines.push("📚 Class: "+(info?.label||""));
    lines.push("👩‍🏫 Class Teacher: "+(ct?.name||"Not assigned"));
    lines.push("📅 Academic Year: "+new Date().getFullYear()+"–"+(new Date().getFullYear()+1));
    lines.push("─────────────────────────");
    lines.push("");

    workingDays.forEach(function(day){
      const slots    = getSlots(day);
      const computed = computeSlots(slots, startMins);
      lines.push("*"+day.toUpperCase()+"*");
      computed.forEach(function(slot,si){
        const cell = (timetable[key][day]||[])[si];
        if(!cell) return;
        const time = minsToTime(slot.startMins)+" – "+minsToTime(slot.endMins);
        if(cell.fixed){
          const icons = {assembly:"🏫",recess:"☕",lunch:"🍱",pt:"⚽",library:"📚",activity:"🎨"};
          lines.push((icons[cell.type]||"·")+" "+time+" "+(cell.label||cell.type));
        } else {
          lines.push("📖 "+time+" "+cell.subject+(cell.tname?" ("+cell.tname+")":""));
        }
      });
      lines.push("");
    });

    lines.push("─────────────────────────");
    lines.push("_Generated by TimeTable Pro_");

    const msg = lines.join("\n");
    const url = "https://wa.me/?text="+encodeURIComponent(msg);
    window.open(url,"_blank");
  }

    y += 12;

    // ── Table ──
    const colW = (pageW - margin*2 - 22) / workingDays.length;
    const rowH = (pageH - y - margin - 8) / Math.max(refS.length,1);
    const timeW = 22;

    // Header row
    doc.setFillColor(30,41,59);
    doc.rect(margin, y, timeW, 8, "F");
    doc.setTextColor(255,255,255);
    doc.setFontSize(7); doc.setFont("helvetica","bold");
    doc.text("TIME", margin+timeW/2, y+5.5, {align:"center"});

    workingDays.forEach((day,di) => {
      const x = margin + timeW + di*colW;
      doc.setFillColor(30,41,59);
      doc.rect(x, y, colW, 8, "F");
      doc.setTextColor(255,255,255);

    });
    y += 8;

    // Data rows
    refS.forEach((slot,si) => {
      const comp   = refComp[si];
      const time   = comp ? minsToTime(comp.startMins) : "";
      const isFixed = isBreak(slot.type)||slot.type==="assembly";
      const rH     = Math.max(rowH, 8);

      // Time cell
      doc.setFillColor(248,250,252);
      doc.rect(margin, y, timeW, rH, "FD");
      doc.setTextColor(100,116,139);
      doc.setFontSize(6); doc.setFont("helvetica","normal");
      doc.text(time, margin+timeW/2, y+rH/2+1, {align:"center"});

      workingDays.forEach((day,di) => {
        const x    = margin + timeW + di*colW;
        const cell = (timetable[key][day]||[])[si];

        if(!cell) {
          doc.setFillColor(248,250,252); doc.rect(x,y,colW,rH,"FD");
        } else if(cell.fixed) {

          const fc = fixedColors[cell.type]||[248,250,252];

        }
      });

    });

    // Footer

          doc.setFillColor(250,250,250); doc.rect(x,y,colW,rH,"FD");
          doc.setTextColor(203,213,225);
          doc.setFontSize(5.5); doc.setFont("helvetica","normal");
          doc.text("free", x+colW/2, y+rH/2+1, {align:"center"});
        }
      });
      y += rH;
    });

    doc.setTextColor(148,163,184);
    doc.setFontSize(6); doc.setFont("helvetica","normal");
    doc.text("Generated by TimeTable Pro  |  "+new Date().toLocaleDateString("en-IN"), pageW-margin, pageH-4, {align:"right"});
    doc.save("Schedule_"+t.name.replace(/\s/g,"_")+".pdf");
  }

  // ── WhatsApp for Teacher ──
  function shareTeacherWhatsApp(teacherId) {
    if(!timetable) return;
    const t = teachers.find(x=>x.id===teacherId);
    if(!t) return;

    const lines = [];
    lines.push("📅 *WEEKLY SCHEDULE — "+t.name+"*");
    lines.push("🏫 "+school.name);
    if(t.bloodGroup) lines.push("🩸 Blood Group: "+t.bloodGroup);
    lines.push("─────────────────────────");
    lines.push("");

    workingDays.forEach(function(day){
      const dayPeriods = [];
      allKeys.forEach(function(k){
        const stdObj = standards.find(function(s){return s.id===k.stdId;});
        const sec    = stdObj?.section||"Primary";
        const sk     = sec+"_"+day;
        const slots  = daySchedules[sk]?.slots||daySchedules[day]?.slots||[];
        const comp   = computeSlots(slots,startMins);
        (timetable[k.key]?.[day]||[]).forEach(function(cell,si){
          if(cell&&!cell.fixed&&cell.teacherId===teacherId){
            const time = comp[si]?minsToTime(comp[si].startMins):"";
            dayPeriods.push({time:time,subject:cell.subject,classLabel:k.label});
          }
        });
      });
      if(dayPeriods.length){
        lines.push("*"+day.toUpperCase()+"*");
        dayPeriods.forEach(function(p){
          lines.push("📖 "+p.time+" "+p.subject+" – "+p.classLabel);
        });
        lines.push("");
      }
    });

    lines.push("─────────────────────────");
    lines.push("_TimeTable Pro · "+school.name+"_");

    const msg = lines.join("\n");
    const phone = (t.whatsapp||"").replace(/\D/g,"");
    const url = "https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
    window.open(url,"_blank");
  }

    const dayHeaders = workingDays.map(d=>`<th style="padding:8px;border:1px solid #94a3b8;background:#7c3aed;color:white;font-size:11px;">${d}</th>`).join("");

      const comp = refTimes[si];
      const time = comp?minsToTime(comp.start)+" – "+minsToTime(comp.end):"";
      const isFixed = isBreak(slot.type)||slot.type==="assembly";
      const cells = workingDays.map(day=>{
        let found = null;
        allKeys.forEach(k=>{
          const cell=(timetable[k.key]?.[day]||[])[si];
          if(cell&&!cell.fixed&&cell.teacherId===teacherId) found={...cell,classLabel:k.label};
        });

          return `<td style="padding:6px 8px;border:1px solid #e2e8f0;background:${bg};">
            <div style="font-weight:700;font-size:11px;">${found.subject}</div>
            <div style="font-size:9px;color:#64748b;">${found.classLabel}</div>

          const icons={assembly:"🏫 Assembly",recess:"☕ Recess",lunch:"🍱 Lunch"};
          return `<td style="padding:6px 8px;border:1px solid #e2e8f0;background:#f8fafc;text-align:center;font-size:9px;color:#94a3b8;">${icons[slot.type]||slot.type}</td>`;
        }
        return `<td style="padding:6px 8px;border:1px solid #f1f5f9;background:#fafafa;text-align:center;font-size:9px;color:#cbd5e1;">free</td>`;

      return `<tr><td style="padding:6px 8px;border:1px solid #e2e8f0;font-size:9px;color:#64748b;white-space:nowrap;font-family:monospace;">${time}</td>${cells}</tr>`;

╚═══════════════════════════════════════════════════════════════╝
--><html><head><title>Schedule – ${t.name}</title>
    <style>body{font-family:Arial,sans-serif;padding:20px;}table{border-collapse:collapse;width:100%;}@media print{body{padding:10px;}@page{size:A4 landscape;margin:10mm;}}</style>

        <div style="color:#64748b;font-size:12px;margin-top:4px;">${school.name||""} ${school.board?"· "+school.board:""}</div>
        <div style="display:flex;gap:20px;margin-top:8px;font-size:11px;flex-wrap:wrap;">
          ${t.whatsapp?`<span>📱 ${t.whatsapp}</span>`:""}

      <tbody>${rows}</tbody>

    <div style="margin-top:12px;font-size:10px;color:#94a3b8;text-align:right;">Generated by TimeTable Pro · ${new Date().toLocaleDateString("en-IN")}</div>

    </body></html>`;

    const w = window.open("","_blank");
    if(w){ w.document.write(html); w.document.close(); }

  // ── Colors ──
  const PALETTE=[
    {bg:"#dbeafe",bdr:"#93c5fd",txt:"#1e40af"},{bg:"#dcfce7",bdr:"#86efac",txt:"#166534"},
    {bg:"#fef9c3",bdr:"#fde047",txt:"#854d0e"},{bg:"#ffe4e6",bdr:"#fda4af",txt:"#9f1239"},
    {bg:"#ede9fe",bdr:"#c4b5fd",txt:"#5b21b6"},{bg:"#ecfeff",bdr:"#a5f3fc",txt:"#155e75"},
    {bg:"#ffedd5",bdr:"#fdba74",txt:"#9a3412"},{bg:"#ccfbf1",bdr:"#5eead4",txt:"#134e4a"},
    {bg:"#e0e7ff",bdr:"#a5b4fc",txt:"#3730a3"},{bg:"#ecfccb",bdr:"#bef264",txt:"#3f6212"},

  const FIXED_STYLE={

    pt:      {bg:"#cffafe",bdr:"#67e8f9",txt:"#155e75",icon:"⚽"},
    library: {bg:"#ede9fe",bdr:"#c4b5fd",txt:"#5b21b6",icon:"📚"},
    activity:{bg:"#ffe4e6",bdr:"#fda4af",txt:"#9f1239",icon:"🎨"},

  const allSubjects=[...new Set(teachers.flatMap(t=>t.subjects||[]))];
  const sColor={};
  allSubjects.forEach((s,i)=>{sColor[s]=PALETTE[i%PALETTE.length];});

  // ── Cell ──
  function Cell({cell,onClick}){
    const clickable = cell&&!cell.fixed&&onClick;
    if(!cell) return(
      <td style={{padding:3}} onClick={onClick}>
        <div style={{minHeight:42,background:"#f8fafc",borderRadius:6,border:"1px dashed #e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",cursor:onClick?"pointer":"default"}}>
          <span style={{fontSize:9,color:"#cbd5e1"}}>+</span>
        </div>
      </td>
    );
    if(cell.fixed){
      const f=FIXED_STYLE[cell.type]||{bg:"#f8fafc",bdr:"#e2e8f0",txt:"#94a3b8",icon:"·"};
      return(
        <td style={{padding:3}}>
          <div style={{background:f.bg,border:`1px solid ${f.bdr}`,borderRadius:6,padding:"5px 4px",minHeight:42,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:10,fontWeight:600,color:f.txt}}>{f.icon} {cell.label}</span>
          </div>
        </td>
      );
    }
    const c=sColor[cell.subject]||{bg:"#f1f5f9",bdr:"#e2e8f0",txt:"#374151"};
    return(
      <td style={{padding:3,verticalAlign:"top",cursor:clickable?"pointer":"default"}} onClick={onClick}>

          <div style={{fontSize:10,fontWeight:700,color:c.txt,lineHeight:1.3}}>{cell.subject}</div>
          {cell.tname&&<div style={{fontSize:10,fontWeight:600,color:c.txt,opacity:0.8,marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cell.tname}</div>}
          {cell.std&&<div style={{fontSize:9,color:c.txt,opacity:0.55,marginTop:1,fontStyle:"italic"}}>{cell.std}</div>}
        </div>
      </td>

    setEditCell({key,day,si});
    setEditSubject(cell?.subject||"");
    setEditTeacher(cell?.teacherId||"");
  }

  // ── Table renderer ──

      <div style={{background:"white",borderRadius:14,border:"1px solid #e2e8f0",overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>

            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              <button onClick={()=>exportCSV(classKey)}
                style={{background:"rgba(255,255,255,0.15)",color:"white",border:"1px solid rgba(255,255,255,0.4)",borderRadius:8,padding:"5px 10px",fontSize:10,fontWeight:700,cursor:"pointer"}}>

              <button onClick={()=>shareWhatsApp(classKey)}

                  </td>

                    const cell=getCellForDay(day,si);

      </div>
    );
  }

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>

      {/* Edit Modal */}
      {editCell&&(()=>{
        const info  = allKeys.find(k=>k.key===editCell.key);

        const si    = editCell.si;
        const currentCell = (timetable?.[editCell.key]?.[day]||[])[si];
        const slotTime = refTimes[si]?minsToTime(refTimes[si].start):"";

        // Check if chosen teacher has a conflict at this slot in another class
        const conflict = editTeacher ? allKeys.filter(k=>k.key!==editCell.key).some(k=>{
          const cell=(timetable?.[k.key]?.[day]||[])[si];
          return cell&&!cell.fixed&&cell.teacherId===editTeacher;
        }) : false;

        const conflictClass = editTeacher ? allKeys.find(k=>k.key!==editCell.key&&(()=>{
          const cell=(timetable?.[k.key]?.[day]||[])[si];
          return cell&&!cell.fixed&&cell.teacherId===editTeacher;
        })()) : null;

        return(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
            <div style={{background:"white",borderRadius:20,width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,0.3)",overflow:"hidden"}}>
              {/* Modal header */}
              <div style={{background:"#4f46e5",color:"white",padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14}}>✏️ Edit Period</div>
                  <div style={{fontSize:11,opacity:0.75,marginTop:2}}>
                    {info?.label} · {day} · {slotTime}
                  </div>
                </div>
                <button onClick={()=>setEditCell(null)}
                  style={{background:"rgba(255,255,255,0.2)",border:"none",color:"white",borderRadius:8,width:28,height:28,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>

              <div style={{padding:18,display:"flex",flexDirection:"column",gap:14}}>
                {/* Current value */}

                <div>

                <div style={{display:"flex",gap:8,marginTop:4}}>

                      if(conflict){

                    style={{flex:2,background:editSubject?"#4f46e5":"#e2e8f0",color:editSubject?"white":"#94a3b8",border:"none",borderRadius:10,padding:"10px",fontWeight:700,fontSize:13,cursor:editSubject?"pointer":"default"}}>

                  Only Principal, Admin or Class Teacher should modify the timetable
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <h2 style={{margin:0,fontSize:17,fontWeight:700,color:"#1e293b"}}>Timetable</h2>
        <button onClick={generate}
          style={{background:"#16a34a",color:"white",border:"none",borderRadius:10,padding:"9px 20px",fontWeight:700,fontSize:13,cursor:"pointer",boxShadow:"0 2px 6px rgba(0,0,0,0.15)"}}>
          ✨ {timetable?"Regenerate":"Generate Timetable"}

        <div style={{background:"white",border:"1px solid #e2e8f0",borderRadius:14,padding:20}}>

            {[
              {label:"Standards configured",ok:standards.length>0,val:standards.length},
              {label:"Teachers added",ok:teachers.length>0,val:teachers.length},
              {label:"Teacher assignments",ok:teachers.some(t=>(t.assignments||[]).length>0),val:teachers.reduce((a,t)=>a+(t.assignments||[]).length,0)},
              {label:"Schedule slots",ok:refSlots.length>0,val:refSlots.length},
            ].map(item=>(
              <div key={item.label} style={{display:"flex",alignItems:"center",gap:10,background:item.ok?"#f0fdf4":"#fff7ed",border:`1px solid ${item.ok?"#bbf7d0":"#fed7aa"}`,borderRadius:8,padding:"8px 14px"}}>
                <span style={{fontSize:16}}>{item.ok?"✅":"⚠️"}</span>
